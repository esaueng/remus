[profile.default]
fail-fast = false

# Coverage instrumentation can consume the sphere/box replay's declared
# two-minute oracle budget when other CPU-heavy tests compete with it. Give
# this case the whole test pool, without changing its budget or assertions.
[profile.coverage]

[[profile.coverage.overrides]]
filter = 'binary(=op_seq_81) & test(=finding_sphere_minus_box_open_mesh)'
priority = 100
threads-required = "num-test-threads"

# Start the known long tail first so it overlaps the rest of the suite instead
# of extending the end of every Linux, macOS, and coverage run.
[[profile.default.overrides]]
filter = 'test(exposed_boss_wall_matches_geometry_across_half_radius) | test(b53_tangent_rim_general_position_neighbours)'
priority = 100

# One to three minutes each at CI's optimization level: started late, one of
# these alone sets the length of its partition.
[[profile.default.overrides]]
filter = 'test(canonical_circle_coil_fillets_keep_input_and_remove_material) | test(an_eccentric_section_well_past_a_hole_edge_is_exact) | test(an_eccentric_section_beside_a_remote_slot_is_exact) | test(a_large_cylinder_across_a_narrow_slot_is_exact_or_refused) | test(sphere_boss_wall_resizes_both_ways_across_scales) | test(free_end_and_bottom_chamfers_meet_in_either_order)'
priority = 100

[[profile.default.overrides]]
filter = 'test(offset_torus_sphere_cut_matches_annulus_overlap) | test(offset_torus_sphere_fuse_retains_both_operands)'
priority = 100

[[profile.default.overrides]]
filter = 'test(batch_offset_torus_sphere_boolean_retains_exact_carriers)'
priority = 90

[[profile.default.overrides]]
filter = 'test(hammer_holder_arm_moves_plus_and_minus_five_with_blend_intact)'
priority = 80

[[profile.default.overrides]]
filter = 'test(hexwall_sequential_cuts_full)'
priority = 80

[[profile.default.overrides]]
filter = 'test(halfsockets_export_fuse_is_analytic_and_watertight)'
priority = 75

[[profile.default.overrides]]
filter = 'test(shapr3d_hammer_holder_blend_refusal_preserves_exact_acceptance_contract)'
priority = 75

[[profile.default.overrides]]
filter = 'test(cross_drilled_render_and_measure_agree_across_ratios_and_scales)'
priority = 70

[[profile.default.overrides]]
filter = 'test(honeycomb_cut_no_longer_throws) | test(honeycomb_cut_residual_documented)'
priority = 65

[[profile.default.overrides]]
filter = 'test(all_committed_bundles_replay)'
priority = 60

[[profile.default.overrides]]
filter = 'test(hammer_holder_adaptive_ladder_converges_monotonically_to_the_finest_reference) | test(hammer_holder_adaptive_reference_agrees_with_mesh_and_vendor_volumes)'
priority = 70
