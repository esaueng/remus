# cargo-audit configuration. Mirrors the advisory exceptions in deny.toml and
# osv-scanner.toml, because cargo-audit reads neither.
#
# RUSTSEC-2026-0192 is an informational "unmaintained" advisory against
# ttf-parser, which enters solely through sctk-adwaita -> ab_glyph (winit's
# Wayland client-side decorations, behind remus-render's `window` feature).
# It never parses untrusted fonts at runtime in this workspace. deny.toml needs
# no entry because its unmaintained check is scoped to workspace (direct)
# dependencies; cargo-audit reports transitive ones. Drop when the winit
# decoration chain moves to a maintained font parser (e.g. skrifa).
[advisories]
ignore = ["RUSTSEC-2026-0192"]
