# cargo-mutants configuration
# https://mutants.rs/config.html
#
# Run locally with: cargo mutants
# CI runs weekly on Sunday (see .github/workflows/mutants.yml).
#
# Scope note: this file covered only the NURBS math, the predicates and the
# boolean algorithm. That is the layer where a wrong answer is a wrong number,
# and it left the layer where a wrong answer is a wrong *solid* unmeasured —
# the blend, offset and modifier code that produced every defect closed in this
# batch. Those crates are added below.

# No fixed `timeout`: it also caps the unmutated baseline run. The per-mutant
# timeout is derived from the measured baseline (5x its test time), floored by
# `minimum_test_timeout` below so a shard whose baseline is only the
# seconds-long math/algo suites cannot report a slow-but-passing mutant as a
# TIMEOUT while the other job saturates the runner.
minimum_test_timeout = 120

# Test cost, not mutant count, is what the weekly budget buys (B19). Measured
# on the hosted runner (4 vCPU): the unmutated baseline took 7,483-7,812 s of
# test time on 2026-09-13/16/20, 99.8% of its CPU in remus-operations, and a
# single test (`exposed_boss_wall_matches_geometry_across_half_radius`) took
# 6,011-6,353 s and finished last. Those three runs examined 0, 0 and 1 of
# 4,620 / 3,375 / 1,966 listed mutants before `timeout` stopped them.
#
# `ci-test` is the profile CI's Test job already uses (opt-level 1, no debug
# info). The same 2,042 operations tests take 14,511 CPU-s in the dev profile
# and 1,293 CPU-s under ci-test on that runner: 11.2x. With this profile, the
# first-failure stop and the exclusions below (before `--tests` was added),
# the runner's baseline for the same five packages took 229 s build + 133 s
# test (dispatch run 36055955228, 2026-09-24), and the auto-set per-mutant
# timeout fell from 38,336 s to 670 s.
profile = "ci-test"

# `cargo test --no-run`, and so nextest's build, also compiles every example by
# default: 17 in remus-operations, each relinked for every operations mutant
# although no example runs as a test. `--tests` selects exactly the targets
# that do (the library, binaries and integration tests), for build and run.
additional_cargo_args = ["--tests"]

additional_cargo_test_args = [
  # A mutant is caught by its first failing test. `.config/nextest.toml` sets
  # `fail-fast = false` for CI, so every caught operations mutant used to run
  # the whole suite (1,219-1,252 s each on 2026-09-06, the same as a missed
  # one). Stop at the first failure and terminate the tests still running.
  "--max-fail=1:immediate",
  # The five operations tests over 60 s under ci-test (500, 103, 98, 96 and
  # 62 s on the runner) are 859 of the package's 1,367 CPU-s, and the 500 s one
  # is a floor on every surviving mutant. They are regression pins for single
  # seam/torus fixtures that CI's Test job runs on every Rust-touching PR and
  # main push; dropping them from the per-mutant oracle can only turn a caught
  # mutant into a reported MISSED, never hide one. Exact names: a renamed test
  # fails `scripts/test-mutants-scope.py` instead of silently rejoining the
  # oracle.
  "-E",
  "not (test(=exposed_boss_wall_matches_geometry_across_half_radius) | test(=the_reported_body_measures_its_closed_form) | test(=offset_torus_sphere_fuse_retains_both_operands) | test(=offset_torus_sphere_cut_matches_annulus_overlap) | test(=offset_torus_sphere_intersect_matches_annulus_overlap))",
]

# The arguments above are nextest syntax; plain `cargo mutants` must use it too.
test_tool = "nextest"

# Each mutant runs only its own package's tests (the cargo-mutants default,
# stated so nobody widens it by accident): an algo mutant costs its build plus
# the ~2 s algo suite, not the operations suite.
test_workspace = false

examine_globs = [
  # Core numerics and the boolean algorithm.
  "crates/math/src/nurbs/**",
  "crates/math/src/predicates.rs",
  "crates/math/src/filtered.rs",
  "crates/math/src/cdt/**",
  "crates/math/src/convex_hull.rs",
  "crates/algo/src/**",

  # The geometry engines. Every defect in the last batch lived here: a blend
  # that returned a silent subset, an offset that reported surviving faces as
  # deleted, modifiers that filled the holes they were told to keep.
  "crates/blend/src/**",
  "crates/offset/src/**",
  "crates/operations/src/**",
]

# Exclude test and bench code from mutation
exclude_globs = ["**/tests/**", "**/tests.rs", "**/benches/**", "**/examples/**"]

# Benchmark-only helpers compiled under `bench-internals`: no test build
# includes them, so every mutant there is "missed" by construction (two
# survivors in the 2026-09-06 run were the `BenchPlane` surface inside
# `benchmark_plane_pair_walk`).
exclude_re = ["benchmark_plane_pair_walk"]
