name: Trusted wasm-candidate
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
env:
  CARGO_TERM_COLOR: always
jobs:
  package:
    name: Build fork package
    runs-on: ${{ fromJSON((vars.CI_FLEET_ENABLED == 'true' || (vars.CI_FLEET_VALIDATION_REF != '' && vars.CI_FLEET_VALIDATION_REF == github.ref)) && (github.repository == 'esaueng/remus' && github.repository_id == '1334765869' && github.actor == 'petergstfsn' && github.actor_id == '171875562' && github.triggering_actor == 'petergstfsn' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.user.login == 'petergstfsn' && github.event.pull_request.user.id == 171875562 && github.event.pull_request.head.repo.id == 1334765869 && github.event.pull_request.base.repo.id == 1334765869 && github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.repo.fork == false && github.event.pull_request.base.ref == 'main' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.ref_protected == true))) && (vars.CI_FLEET_TARGET == 'ci-server-jane' && '{"group":"ci-trusted-main","labels":"ci-server-jane"}' || vars.CI_FLEET_TARGET == 'ci-server-john' && '{"group":"ci-trusted-main","labels":"ci-server-john"}') || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: esaueng/remus/.github/actions/fleet-guard@29779e3185e8582b59bf58692a307b1018a98e68
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust on disposable runners
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: runner.environment != 'self-hosted'

      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: wasm-pack

      - name: Build and validate WASM packages
        run: cargo xtask wasm-build

      - name: Stamp fork provenance
        run: |
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            npm --prefix "$pkg" pkg set \
              repository.type=git \
              repository.url=git+https://github.com/esaueng/remus.git \
              homepage=https://github.com/esaueng/remus \
              remusSourceCommit="$GITHUB_SHA"
          done

      - name: Pack npm-compatible artifacts
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            (cd "$pkg" && npm pack --pack-destination "$RUNNER_TEMP/packed")
          done
          echo "path=$RUNNER_TEMP/packed" >> "$GITHUB_OUTPUT"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remus-wasm-candidate-${{ github.sha }}
          path: ${{ steps.pack.outputs.path }}/*.tgz
          if-no-files-found: error
