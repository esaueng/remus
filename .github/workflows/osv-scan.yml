name: OSV Scan

# Complements the Dependabot cooldown: cooldown blocks fresh-but-untrusted,
# OSV blocks old-but-known-bad. Covers both Cargo and npm lockfiles.
# PRs are report-only; main + weekly schedule fail closed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-progress main/schedule scans — a rapid second push would
  # otherwise leave the older commit's lockfile unscanned.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OSV_IMAGE: ghcr.io/google/osv-scanner-action@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc

jobs:
  scan:
    name: OSV Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select PR base for comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git checkout --detach "$BASE_SHA"
      - name: Scan PR base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/github/workspace" --volume "$RUNNER_TEMP:/github/temp" --workdir /github/workspace \
            --env GOTOOLCHAIN=auto --env GITHUB_ACTIONS --env CI \
            --env GITHUB_WORKSPACE=/github/workspace --env GITHUB_REPOSITORY \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_SERVER_URL \
            --entrypoint /root/osv-scanner "$OSV_IMAGE" \
            --format=json \
            --output=/github/temp/old-results.json \
            --lockfile=Cargo.lock \
            --lockfile=package-lock.json
      - name: Select tested commit
        run: git checkout --force --detach "$GITHUB_SHA"
      - name: Scan tested commit
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/github/workspace" --volume "$RUNNER_TEMP:/github/temp" --workdir /github/workspace \
            --env GOTOOLCHAIN=auto --env GITHUB_ACTIONS --env CI \
            --env GITHUB_WORKSPACE=/github/workspace --env GITHUB_REPOSITORY \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_SERVER_URL \
            --entrypoint /root/osv-scanner "$OSV_IMAGE" \
            --format=json \
            --output=/github/temp/new-results.json \
            --lockfile=Cargo.lock \
            --lockfile=package-lock.json
      - name: Report new PR vulnerabilities
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/github/workspace" --volume "$RUNNER_TEMP:/github/temp" --workdir /github/workspace \
            --env GOTOOLCHAIN=auto --env GITHUB_ACTIONS --env CI \
            --env GITHUB_WORKSPACE=/github/workspace --env GITHUB_REPOSITORY \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_SERVER_URL \
            --entrypoint /root/osv-reporter "$OSV_IMAGE" \
            --output=results.sarif \
            --old=/github/temp/old-results.json \
            --new=/github/temp/new-results.json \
            --gh-annotations=true \
            --fail-on-vuln=true
      - name: Report main vulnerabilities
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/github/workspace" --volume "$RUNNER_TEMP:/github/temp" --workdir /github/workspace \
            --env GOTOOLCHAIN=auto --env GITHUB_ACTIONS --env CI \
            --env GITHUB_WORKSPACE=/github/workspace --env GITHUB_REPOSITORY \
            --env GITHUB_SHA --env GITHUB_REF --env GITHUB_SERVER_URL \
            --entrypoint /root/osv-reporter "$OSV_IMAGE" \
            --output=results.sarif \
            --new=/github/temp/new-results.json \
            --gh-annotations=false \
            --fail-on-vuln=true
      - name: Preserve scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-results
          path: |
            results.sarif
            ${{ runner.temp }}/new-results.json
            ${{ runner.temp }}/old-results.json
          if-no-files-found: error
          retention-days: 5
      - name: Upload code scanning results
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
