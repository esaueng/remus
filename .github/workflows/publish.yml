name: Refresh Apache Staging Package

# Keeps the committed package at `crates/wasm/pkg` in step with the source on
# `main`. That directory is a real distribution channel: it is installed
# directly by git path, so whatever is committed there is what a consumer gets.
# A stale snapshot silently serves old kernel behavior while the Rust source
# looks current, which is why this runs on every push rather than on request.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_package:
        description: "Rebuild crates/wasm/pkg on main"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apache-package-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The committed package directory is a real distribution channel, not a
  # build leftover: OpenZCAD installs this repo as
  #   "remus-wasm": "github:esaueng/remus#main&path:/crates/wasm/pkg"
  # so npm/pnpm fetches whatever `crates/wasm/pkg` holds on main. Nothing
  # A missed refresh would leave consumers running stale generated code while
  # main's Rust source appears current.
  build-committed-package:
    name: Build committed WASM package
    runs-on: ubuntu-latest
    # Skip the bot's own commit so this cannot loop. `[skip ci]` in the commit
    # message already suppresses the re-run; this is the belt-and-braces half.
    #
    # Also runnable on demand: GitHub does not raise workflow runs for a push
    # that edits files under .github/workflows, so a change to this file only
    # takes effect on the NEXT ordinary commit. Without a manual trigger there
    # is no way to refresh the package — or to prove a change here works —
    # until some unrelated PR happens to land.
    if: >-
      ${{ (github.event_name == 'push'
           && !contains(github.event.head_commit.message, '[skip ci]'))
          || (github.event_name == 'workflow_dispatch'
              && inputs.sync_package
              && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch can select another ref in the UI; always build the
          # Apache staging branch selected by the job guard above.
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # rust-toolchain.toml provides the pinned Rust version + wasm32 target
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: wasm-pack

      # Keep the staging package on the same reproducible build path that the
      # standalone project will use after it adopts its final package name.
      - name: Build, merge, validate, and smoke-test WASM package
        run: cargo xtask wasm-build --skip-opt

      # Point consumers of the committed directory at this repo. Deliberately
      # stable fields only — stamping the commit SHA here would make the diff
      # non-empty on every run and commit even when the kernel is unchanged.
      - name: Stamp fork provenance
        working-directory: crates/wasm/pkg
        run: |
          npm pkg set \
            repository.type=git \
            repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git \
            homepage=https://github.com/${GITHUB_REPOSITORY}

      # Build scripts execute before this point. Pass only the generated
      # package to a fresh runner that will receive the repository write token.
      - name: Archive generated package
        # Use the system binary by absolute path because build scripts can add
        # a malicious replacement to GITHUB_PATH for later steps in this job.
        run: /usr/bin/tar -czf committed-wasm-package.tar.gz crates/wasm/pkg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: committed-wasm-package
          path: committed-wasm-package.tar.gz
          if-no-files-found: error

  sync-committed-package:
    name: Commit refreshed WASM package
    needs: [build-committed-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: committed-wasm-package

      - name: Install generated package
        run: |
          # Never extract an artifact produced by build-time code directly
          # into the checkout. The installer accepts only regular files and
          # directories beneath crates/wasm/pkg.
          /usr/bin/python3 scripts/install-wasm-package-archive.py \
            committed-wasm-package.tar.gz crates/wasm/pkg

      - name: Check whether the package needs publishing
        id: package-diff
        run: |
          # wasm-pack places a `*` .gitignore in its output directory, so force
          # staging is required for newly generated package files.
          git add --force crates/wasm/pkg
          if git diff --cached --quiet -- crates/wasm/pkg; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Committed package already matches this build — nothing to publish."
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require publish credentials
        if: ${{ steps.package-diff.outputs.needs_publish == 'true' }}
        env:
          REMUS_BOT_APP_ID: ${{ vars.REMUS_BOT_APP_ID }}
          REMUS_BOT_PRIVATE_KEY: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}
        run: ./scripts/require-publish-credentials.sh

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ steps.package-diff.outputs.needs_publish == 'true' }}
        with:
          app-id: ${{ vars.REMUS_BOT_APP_ID }}
          private-key: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}

      - name: Commit refreshed package
        if: ${{ steps.package-diff.outputs.needs_publish == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Disable every Git hook while a write token is present. The build
          # runner never sees this token or this checkout.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VERSION=$(jq -r .version crates/wasm/pkg/package.json)
          git commit -m "chore(wasm): refresh committed package to v${VERSION} from ${GITHUB_SHA:0:7} [skip ci]"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Never rebase an artifact generated from an older source commit onto
          # a newer branch head. A concurrent source push makes this push fail;
          # that newer push starts its own refresh from the correct source.
          git push "$remote" HEAD:main
          echo "::notice::Committed remus-wasm ${VERSION}; consumers on #main pick it up on the next install."
