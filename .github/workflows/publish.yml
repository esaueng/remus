name: Refresh Apache Staging Package

# Keeps the committed packages at `crates/wasm/pkg` (kernel) and
# `crates/wasm-io/pkg` (file-format translators) in step with the source on
# `main`. Those directories are a real distribution channel: they are installed
# directly by git path, so whatever is committed there is what a consumer gets.
# A stale snapshot silently serves old kernel behavior while the Rust source
# looks current. CI calls this workflow after qualifying its main-push artifact.
on:
  workflow_call:
    inputs:
      reuse_artifact:
        description: Consume this CI run's qualified package artifact on protected main
        type: boolean
        default: false
    secrets:
      REMUS_BOT_PRIVATE_KEY:
        description: App key resolved by the protected remus-bot writer environment
        required: true
  workflow_dispatch:
    inputs:
      sync_package:
        description: "Rebuild crates/wasm/pkg on main"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apache-package-refresh-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The committed package directories are a real distribution channel, not a
  # build leftover: OpenZCAD installs this repo as
  #   "remus-wasm": "github:esaueng/remus#main&path:/crates/wasm/pkg"
  #   "remus-wasm-io": "github:esaueng/remus#main&path:/crates/wasm-io/pkg"
  # so npm/pnpm fetches whatever those directories hold on main.
  # A missed package-affecting refresh would leave consumers running stale generated code while
  # main's Rust source appears current.
  build-committed-package:
    name: Build committed WASM package
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -Dwarnings
    runs-on: ubuntu-24.04
    # A warm build takes about 20 minutes.
    timeout-minutes: 60
    # Automatic CI calls reuse the tested artifact and skip this rebuild.
    # A manual run is restricted to main; both jobs check out its exact event SHA.
    if: >-
      ${{ !inputs.reuse_artifact && github.event_name == 'workflow_dispatch'
          && inputs.sync_package && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch can select another ref in the UI; always build the
          # Apache staging branch selected by the job guard above.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # rust-toolchain.toml provides the pinned Rust version + wasm32 target
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: wasm-package
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack@0.15.0

      # Keep the staging package on the same reproducible build path that the
      # standalone project will use after it adopts its final package name.
      - name: Build, merge, validate, and smoke-test WASM packages
        run: cargo xtask wasm-build

      # Point consumers of the committed directory at this repo. Deliberately
      # stable fields only — stamping the commit SHA here would make the diff
      # non-empty on every run and commit even when the kernel is unchanged.
      - name: Stamp fork provenance
        run: |
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            npm --prefix "$pkg" pkg set \
              repository.type=git \
              repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git \
              homepage=https://github.com/${GITHUB_REPOSITORY}
          done

      # Build scripts execute before this point. Pass only the generated
      # package to a fresh runner that will receive the repository write token.
      - name: Archive generated packages
        # Use the system binary by absolute path because build scripts can add
        # a malicious replacement to GITHUB_PATH for later steps in this job.
        run: /usr/bin/tar -czf committed-wasm-package.tar.gz crates/wasm/pkg crates/wasm-io/pkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: committed-wasm-package
          compression-level: 0
          path: committed-wasm-package.tar.gz
          if-no-files-found: error

  sync-committed-package:
    name: Propose refreshed WASM package
    needs: [build-committed-package]
    # Only the CI caller uses reuse_artifact, after its required completion gate
    # has accepted both runtime suites. Artifacts stay inside the same run/SHA.
    if: >-
      ${{ !cancelled() && github.repository == 'esaueng/remus'
          && github.ref == 'refs/heads/main' && github.ref_protected
          && (needs.build-committed-package.result == 'success'
              || (inputs.reuse_artifact && github.event_name == 'push')) }}
    environment: remus-bot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: committed-wasm-package

      - name: Install generated packages
        run: |
          # Never extract an artifact produced by build-time code directly
          # into the checkout. The installer accepts only regular files and
          # directories beneath the two package roots.
          /usr/bin/python3 scripts/install-wasm-package-archive.py \
            committed-wasm-package.tar.gz crates/wasm/pkg crates/wasm-io/pkg

      - name: Check whether the package needs publishing
        id: package-diff
        run: |
          # wasm-pack places a `*` .gitignore in its output directory, so force
          # staging is required for newly generated package files.
          git add --force crates/wasm/pkg crates/wasm-io/pkg
          if git diff --cached --quiet -- crates/wasm/pkg crates/wasm-io/pkg; then
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Committed package already matches this build — nothing to publish."
          else
            python3 scripts/check-wasm-version.py --base "$GITHUB_SHA"
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require publish credentials
        if: ${{ steps.package-diff.outputs.needs_publish == 'true' }}
        env:
          REMUS_BOT_APP_ID: ${{ vars.REMUS_BOT_APP_ID }}
          REMUS_BOT_PRIVATE_KEY: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}
        run: ./scripts/require-publish-credentials.sh

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ steps.package-diff.outputs.needs_publish == 'true' }}
        with:
          app-id: ${{ vars.REMUS_BOT_APP_ID }}
          private-key: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}
          owner: esaueng
          repositories: remus
          permission-contents: write
          permission-pull-requests: write

      - name: Open package refresh PR
        if: ${{ steps.package-diff.outputs.needs_publish == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Disable every Git hook while a write token is present. The build
          # runner never sees this token or this checkout.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        run: python3 scripts/publish-wasm-package-pr.py
