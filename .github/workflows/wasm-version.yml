name: WASM version guard

on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  integrity:
    name: Committed packages match source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test integrity and publisher scope guards
        run: |
          python3 scripts/test-wasm-package-integrity.py
          bash scripts/test-publish-credentials.sh
      - name: Detect committed package changes
        id: packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git rev-parse --verify "$BASE_SHA^{commit}"
          if git diff --quiet "$BASE_SHA" HEAD -- crates/wasm/pkg crates/wasm-io/pkg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.packages.outputs.changed == 'true'
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        if: steps.packages.outputs.changed == 'true'
        with:
          shared-key: wasm-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: steps.packages.outputs.changed == 'true'
        with:
          tool: wasm-pack@0.15.0
      - name: Rebuild both packages and compare every committed file
        if: steps.packages.outputs.changed == 'true'
        run: |
          # Remove committed files first: a build must not inherit extra payload
          # files planted in a package that wasm-pack would otherwise leave alone.
          rm -rf -- crates/wasm/pkg crates/wasm-io/pkg
          cargo xtask wasm-build
          python3 scripts/check-wasm-package-integrity.py --revision HEAD
      # A package-only diff (a refresh PR) runs no heavy CI tier
      # (scripts/classify-ci-changes.py), so CI's WASM Size Gate skips it. Apply
      # the same gate here to the modules just proven to match a source build,
      # with the BASE commit's scripts and committed packages, as CI does.
      - name: Enforce the kernel size policy and growth review
        if: steps.packages.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base="$RUNNER_TEMP/size-base"
          built="$RUNNER_TEMP/size-pr"
          git worktree add --detach "$base" "$BASE_SHA"
          # Bootstrap: a base from before the gate has no script to trust yet.
          if [ ! -f "$base/scripts/wasm-size-gate.mjs" ]; then
            echo "::notice::The base commit predates scripts/wasm-size-gate.mjs; the size gate applies from the next base."
            exit 0
          fi
          mkdir -p "$built"
          cp crates/wasm/pkg/remus_wasm_bg.wasm "$built/pr-remus_wasm.wasm"
          cp crates/wasm-io/pkg/remus_wasm_io_bg.wasm "$built/pr-remus_wasm_io.wasm"
          report="$RUNNER_TEMP/wasm-size-report.md"
          status=0
          node "$base/scripts/wasm-size-gate.mjs" --github-pr-body --base-dir "$base" \
            --pr-dir "$built" --markdown "$report" || status=$?
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 0 pass, 1 policy or growth failure, anything else a measurement error.
          exit "$status"

  version:
    name: Changed kernel requires a new version
    # Keep integrity inside the existing version-check dependency chain.
    needs: integrity
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful package integrity
        env:
          INTEGRITY_RESULT: ${{ needs.integrity.result }}
        run: |
          if [[ "$INTEGRITY_RESULT" != "success" ]]; then
            echo "::error::Package integrity did not succeed: $INTEGRITY_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version guard regressions
        run: |
          python3 scripts/test-wasm-version-guard.py
          bash scripts/test-pin-sibling-versions.sh
      - name: Check committed package versions against the integration base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/check-wasm-version.py --base "$BASE_SHA" --head HEAD
