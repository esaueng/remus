name: WASM version guard

on:
  pull_request:
  merge_group:

concurrency:
  # Replace obsolete PR rebuilds; every queue candidate retains its verdict.
  group: wasm-version-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  integrity:
    name: Committed packages match source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test integrity and publisher scope guards
        run: |
          python3 scripts/test-wasm-package-integrity.py
          python3 scripts/test_ci_concurrency.py
          python3 scripts/test_reuse_wasm_qualification.py
          bash scripts/test-publish-credentials.sh
      - name: Detect committed package changes
        id: packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git rev-parse --verify "$BASE_SHA^{commit}"
          if git diff --quiet "$BASE_SHA" HEAD -- crates/wasm/pkg crates/wasm-io/pkg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A diff may change a committed package and the scripts that check it
      # together, so the checks below run the BASE commit's copies against
      # this checkout, as the size gate does.
      - name: Check out the base commit's package checkers
        id: checkers
        if: steps.packages.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          base="$RUNNER_TEMP/checker-base"
          git worktree add --detach "$base" "$BASE_SHA"
          echo "dir=$base" >> "$GITHUB_OUTPUT"
      - name: Reuse an identical protected-main package qualification
        id: qualification
        if: steps.packages.outputs.changed == 'true'
        env:
          CHECKERS: ${{ steps.checkers.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bootstrap: a base script without --checkout would qualify the base
          # tree instead of this one, so such a base reuses nothing.
          if ! grep -qs -- '--checkout' "$CHECKERS/scripts/reuse-wasm-qualification.py"; then
            echo "::notice::The base commit's reuse script cannot qualify another checkout; rebuilding both packages."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$CHECKERS/scripts/reuse-wasm-qualification.py" --checkout "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.packages.outputs.changed == 'true'
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        if: steps.packages.outputs.changed == 'true' && steps.qualification.outputs.reused != 'true'
        with:
          shared-key: wasm-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: steps.packages.outputs.changed == 'true' && steps.qualification.outputs.reused != 'true'
        with:
          tool: wasm-pack@0.15.0
      - name: Rebuild both packages and compare every committed file
        if: steps.packages.outputs.changed == 'true' && steps.qualification.outputs.reused != 'true'
        env:
          CHECKERS: ${{ steps.checkers.outputs.dir }}
        run: |
          # Fail closed: main has carried this checker far longer than the size
          # gate, so a base without it is stale rather than a bootstrap to skip.
          if [ ! -f "$CHECKERS/scripts/check-wasm-package-integrity.py" ]; then
            echo "::error::The base commit has no scripts/check-wasm-package-integrity.py; rebase onto main."
            exit 1
          fi
          # Remove committed files first: a build must not inherit extra payload
          # files planted in a package that wasm-pack would otherwise leave alone.
          rm -rf -- crates/wasm/pkg crates/wasm-io/pkg
          # This build runs the PR's own xtask, build.rs and proc macros on this
          # runner, so hostile build code could alter $CHECKERS or reproduce
          # planted bytes. The comparison catches honest drift only; build
          # tooling changes need human review (SECURITY.md, Supply Chain).
          cargo xtask wasm-build
          python3 "$CHECKERS/scripts/check-wasm-package-integrity.py" --revision HEAD
      # A package-only diff (a refresh PR) runs no heavy CI tier
      # (scripts/classify-ci-changes.py), so CI's WASM Size Gate skips it. Apply
      # the same gate here to the modules just proven to match a source build,
      # with the BASE commit's scripts and committed packages, as CI does.
      - name: Enforce the kernel size policy and growth review
        if: steps.packages.outputs.changed == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          base="$RUNNER_TEMP/size-base"
          built="$RUNNER_TEMP/size-pr"
          git worktree add --detach "$base" "$BASE_SHA"
          # Bootstrap: a base from before the gate has no script to trust yet.
          if [ ! -f "$base/scripts/wasm-size-gate.mjs" ]; then
            echo "::notice::The base commit predates scripts/wasm-size-gate.mjs; the size gate applies from the next base."
            exit 0
          fi
          mkdir -p "$built"
          cp crates/wasm/pkg/remus_wasm_bg.wasm "$built/pr-remus_wasm.wasm"
          cp crates/wasm-io/pkg/remus_wasm_io_bg.wasm "$built/pr-remus_wasm_io.wasm"
          report="$RUNNER_TEMP/wasm-size-report.md"
          status=0
          node "$base/scripts/wasm-size-gate.mjs" --github-pr-body --base-dir "$base" \
            --pr-dir "$built" --markdown "$report" || status=$?
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 0 pass, 1 policy or growth failure, anything else a measurement error.
          exit "$status"

  version:
    name: Changed kernel requires a new version
    # Keep integrity inside the existing version-check dependency chain.
    needs: integrity
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful package integrity
        env:
          INTEGRITY_RESULT: ${{ needs.integrity.result }}
        run: |
          if [[ "$INTEGRITY_RESULT" != "success" ]]; then
            echo "::error::Package integrity did not succeed: $INTEGRITY_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version guard regressions
        run: |
          python3 scripts/test-wasm-version-guard.py
          bash scripts/test-pin-sibling-versions.sh
      - name: Check committed package versions against the integration base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/check-wasm-version.py --base "$BASE_SHA" --head HEAD
