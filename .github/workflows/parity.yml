name: Native WASM Parity

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/parity.yml'
      - 'tools/parity/**'
      - 'scripts/test-o15*'

permissions:
  contents: read

concurrency:
  group: parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_MIN_STACK: "33554432"
  O15_PROOF_OUT: ${{ github.workspace }}/target/o15-proof

jobs:
  proof:
    name: Contract and split-translator parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Initial platform registration; other native hosts remain unqualified.
        os: [ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize proof artifacts
        run: |
          mkdir -p "$O15_PROOF_OUT"
          printf 'runner_os=%s\nrunner_arch=%s\ncheckout_sha=%s\nrust_min_stack=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_SHA" "$RUST_MIN_STACK" > "$O15_PROOF_OUT/workflow.txt"
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-pack
      - name: Check workflow policy
        run: |
          python3 scripts/test-o15-workflow.py
          python3 scripts/test-o15-proof.py
      - name: Run contract and split-translator proof
        timeout-minutes: 75
        run: |
          set -o pipefail
          bash scripts/test-o15-proof.sh 2>&1 | tee "$O15_PROOF_OUT/run.log"
      - name: Retain parity reports and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: o15-proof-${{ matrix.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.O15_PROOF_OUT }}/
          if-no-files-found: error
          retention-days: 14
