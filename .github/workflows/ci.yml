name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  # Shared groups replace pending runs even when running cancellation is off.
  # Give each non-PR run its own group so every main commit keeps its verdict.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege by default: jobs run with a read-only token unless they
# explicitly opt into more (e.g. the wasm-size PR comment job below).
permissions:
  contents: read

# rust-toolchain.toml pins the exact Rust version (1.96.0) and includes
# rustfmt, clippy, and the wasm32 target. Rustup auto-detects it, so most
# jobs don't need dtolnay/rust-toolchain.

jobs:
  checks:
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    uses: esaueng/remus/.github/workflows/fleet-ci.yml@0f19a7af22d91142222428982823ae14b6d51cf3

  wasm-size:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.wasm == 'true'
    uses: esaueng/remus/.github/workflows/fleet-wasm-size.yml@0f19a7af22d91142222428982823ae14b6d51cf3
    permissions:
      contents: read
      pull-requests: write
