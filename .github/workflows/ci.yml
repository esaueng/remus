name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Compare this branch with the selected base ref
        required: true
        default: main
        type: string

concurrency:
  # Shared groups replace pending runs even when running cancellation is off.
  # Give each non-PR run its own group so every main commit keeps its verdict.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege by default: jobs run with a read-only token unless they
# explicitly opt into more (e.g. the wasm-size PR comment job below).
permissions:
  contents: read

# rust-toolchain.toml pins the exact Rust version (1.96.0) and includes
# rustfmt, clippy, and the wasm32 target. Rustup auto-detects it, so most
# jobs don't need dtolnay/rust-toolchain.

jobs:
  public-commit-metadata:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commit metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_BASE: origin/${{ inputs.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [[ "$EVENT_NAME" == push ]]; then
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
          else
            base="$DISPATCH_BASE"
            head="$HEAD_SHA"
          fi
          if [[ -z "$base" || -z "$head" || "$base" =~ ^0+$ || "$head" =~ ^0+$ ]]; then
            echo 'Commit metadata range is unavailable.' >&2
            exit 1
          fi
          python3 scripts/check_public_commit_metadata.py --base "$base" --head "$head"
      - name: Test metadata policy with synthetic identities
        run: python3 -m unittest discover -s scripts -p 'test_check_public_commit_metadata.py'

  checks:
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    uses: esaueng/remus/.github/workflows/fleet-ci-v11.yml@ff8415b3005256df5a65af5c92b8c26caa4c878f

  # Posts the WASM size report as a PR comment. It needs a write token, so it
  # stays outside `checks`; the same policy gates CI Pass through
  # fleet-ci-v11.yml's read-only wasm-size-gate job. It also runs when CI failed
  # (a size failure fails CI Pass), so the comment never goes stale.
  wasm-size:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.checks.outputs.wasm == 'true' }}
    uses: esaueng/remus/.github/workflows/fleet-wasm-size-v5.yml@4e5bd846fae03e87e3d4ca1169e35b18952d4fb9
    permissions:
      contents: read
      pull-requests: write

  publish-package:
    needs: [checks, public-commit-metadata]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.ref_protected && needs.checks.result == 'success' &&
      needs.public-commit-metadata.result == 'success' &&
      needs.checks.outputs.wasm == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
    with:
      reuse_artifact: true
    # Environment-only secrets still need an explicit reusable-workflow binding.
    # The clean writer resolves this key inside the protected remus-bot environment.
    secrets:
      REMUS_BOT_PRIVATE_KEY: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}
