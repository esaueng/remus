name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  # Supersede only PR runs. Every main push keeps its run so each merge
  # commit gets a completed verdict instead of being cancelled by the next
  # merge in a burst.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege by default: jobs run with a read-only token unless they
# explicitly opt into more (e.g. the wasm-size PR comment job below).
permissions:
  contents: read

# rust-toolchain.toml pins the exact Rust version (1.96.0) and includes
# rustfmt, clippy, and the wasm32 target. Rustup auto-detects it, so most
# jobs don't need dtolnay/rust-toolchain.

jobs:
  checks:
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    uses: esaueng/remus/.github/workflows/fleet-ci.yml@eb2ad067931c96e824bd8f5bcc28aaa925a4d4ea

  wasm-size:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.wasm == 'true'
    uses: esaueng/remus/.github/workflows/fleet-wasm-size.yml@6da8b6a0777bd3e4e9248397626dce0636dce4c7
    permissions:
      contents: read
      pull-requests: write
