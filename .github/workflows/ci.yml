name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege by default: jobs run with a read-only token unless they
# explicitly opt into more (e.g. the wasm-size PR comment job below).
permissions:
  contents: read

# rust-toolchain.toml pins the exact Rust version (1.96.0) and includes
# rustfmt, clippy, and the wasm32 target. Rustup auto-detects it, so most
# jobs don't need dtolnay/rust-toolchain.

jobs:
  checks:
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    uses: esaueng/remus/.github/workflows/fleet-ci.yml@6d8b64129c5d77748f089451450452d277892b37

  wasm-size:
    needs: checks
    if: github.event_name == 'pull_request' && needs.checks.outputs.heavy == 'true'
    uses: esaueng/remus/.github/workflows/fleet-wasm-size.yml@6d8b64129c5d77748f089451450452d277892b37
    permissions:
      contents: read
      pull-requests: write
