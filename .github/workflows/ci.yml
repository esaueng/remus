name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege by default: jobs run with a read-only token unless they
# explicitly opt into more (e.g. the wasm-size PR comment job below).
permissions:
  contents: read

# rust-toolchain.toml pins the exact Rust version (1.96.0) and includes
# rustfmt, clippy, and the wasm32 target. Rustup auto-detects it, so most
# jobs don't need dtolnay/rust-toolchain.

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      docs: ${{ steps.classify.outputs.docs }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then
            base="$PUSH_BASE"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          python3 scripts/classify-ci-changes.py \
            --base "$base" \
            --head "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Summarize selection
        env:
          MODE: ${{ steps.classify.outputs.mode }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: echo "CI mode is ${MODE} for ${CHANGED_COUNT} changed path(s)." >> "$GITHUB_STEP_SUMMARY"

  owner-pr:
    name: Owner PR Rust checks
    needs: changes
    permissions:
      contents: read
      pull-requests: read
    # The runner group permits only this immutable callee, never PR workflow refs.
    uses: esaueng/remus/.github/workflows/owner-pr.yml@126778b2b4e7bb95447d736256e2357a3b6b38ad
    with:
      heavy: ${{ needs.changes.outputs.heavy == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}

  repo-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-machete@0.9.1,taplo-cli@0.9.3
      - name: Run repository policy checks
        shell: bash
        run: |
          status=0
          check() {
            label=$1
            shift
            echo "::group::${label}"
            "$@" || status=1
            echo "::endgroup::"
          }

          check "Apache lineage" ./scripts/check-apache-lineage.sh
          check "Rust format" cargo fmt --all -- --check
          check "Layer boundaries" ./scripts/check-boundaries.sh
          check "Deterministic hashing ratchet" ./scripts/check-det-hash.sh
          check "Edge-domain authority" ./scripts/check-edge-domain-authority.py
          check "Documentation paths" ./scripts/check-doc-paths.sh
          check "Documentation module map" ./scripts/check-doc-module-map.py
          check "Product naming" ./scripts/check-remus-rename.sh
          check "Publish workflow contract" ./scripts/test-publish-credentials.sh
          check "Gauntlet workflow contract" python3 scripts/test-gauntlet-workflow.py
          check "Owner PR policy tests" python3 scripts/test-owner-pr-policy.py
          check "Owner PR routing tests" python3 scripts/test-owner-pr-routing.py
          check "CI classifier tests" python3 scripts/test-classify-ci-changes.py
          check "Unused dependencies" cargo machete
          check "TOML format" taplo fmt --check
          exit "$status"

  clippy:
    name: Clippy
    needs: [changes, owner-pr]
    if: needs.changes.outputs.heavy == 'true' && needs.owner-pr.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: [changes, owner-pr]
    if: needs.changes.outputs.heavy == 'true' && needs.owner-pr.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.62.30
        with:
          tool: nextest
      - run: cargo nextest run --workspace --cargo-profile ci-test
      # nextest doesn't run doc tests, so run them separately
      - run: cargo test --workspace --profile ci-test --doc
      # Complexity-regression guards: deterministic work-counter tests that fail
      # if a boolean hot path regresses to O(N²) (issue #987). Gated behind the
      # `perf-counters` feature, so they need an explicit run.
      - name: Complexity guards
        run: cargo nextest run -p remus-operations --features perf-counters --cargo-profile ci-test -E 'test(scaling_)'

  approx-census:
    name: Approximation Census
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test census contract
        run: python3 scripts/check-approx-census.py --self-test
      - name: Compare approximation census
        run: python3 scripts/check-approx-census.py

  platform-test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest
      - run: cargo nextest run --workspace --cargo-profile ci-test

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.62.30
        with:
          tool: cargo-llvm-cov,nextest
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --fail-under-lines 60
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: lcov.info
          use_oidc: true

  msrv:
    name: MSRV (1.88)
    needs: [changes, owner-pr]
    if: needs.changes.outputs.heavy == 'true' && needs.owner-pr.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Override rust-toolchain.toml to test the declared minimum version.
      # Action SHA stays pinned; the Rust version is set explicitly below.
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: msrv
      - run: cargo check --workspace --all-features

  wasm:
    name: WASM Build & Validate
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.62.30
        with:
          tool: wasm-pack
      - name: Build and validate WASM
        run: cargo xtask wasm-build
      - name: Prepare WASM size artifacts
        if: github.event_name == 'pull_request'
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          mkdir -p "$RUNNER_TEMP/wasm-size"
          # kernel module first, translator module second
          for crate_dir in crates/wasm crates/wasm-io; do
            wasm_package=$(jq -r '.packages[] | select(.manifest_path | endswith("/'"$crate_dir"'/Cargo.toml")) | .name' <<< "$metadata")
            wasm_target=$(jq -r '.packages[] | select(.name == $package) | .targets[] | select(.crate_types | index("cdylib")) | .name' --arg package "$wasm_package" <<< "$metadata")
            test -n "$wasm_target"
            cp "$crate_dir/pkg/${wasm_target}_bg.wasm" "$RUNNER_TEMP/wasm-size/pr-${wasm_target}.wasm"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: wasm-size-pr
          path: ${{ runner.temp }}/wasm-size/pr-*.wasm
          if-no-files-found: error
          retention-days: 1
      - name: Validate npm package contents
        run: |
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            (cd "$pkg" && npm pack --dry-run)
          done
      - name: Build WASM without optional I/O
        run: |
          cargo clippy -p remus-wasm --target wasm32-unknown-unknown --no-default-features -- -D warnings
          cargo test -p remus-wasm --no-default-features
      - name: W9 native and WASM preflight workflow
        run: bash scripts/test-w9-preflight.sh
      - name: Preserve W9 stage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w9-preflight
          path: target/w9-preflight.json
          if-no-files-found: warn

  fuzz-check:
    name: Fuzz Targets Compile
    needs: [changes, owner-pr]
    if: needs.changes.outputs.heavy == 'true' && needs.owner-pr.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins

  render:
    name: Software Rendering
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
      REMUS_REQUIRE_WGPU_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
      - run: cargo test -p remus-render

  wasm-size:
    name: WASM Size Report
    needs: [changes, wasm]
    if: github.event_name == 'pull_request' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-size-pr
          path: ${{ runner.temp }}/wasm-size
      - name: Measure both modules against the committed base packages
        run: |
          # The base checkout holds the committed packages; a module with no
          # committed base yet (first PR that adds it) reports as new.
          rows=""
          kernel_delta=0
          for stem in remus_wasm remus_wasm_io; do
            case "$stem" in
              remus_wasm) crate_dir=crates/wasm ;;
              remus_wasm_io) crate_dir=crates/wasm-io ;;
            esac
            pr_size=$(stat --printf="%s" "$RUNNER_TEMP/wasm-size/pr-${stem}.wasm")
            pr_mb=$(echo "scale=2; $pr_size / 1048576" | bc)
            base_file="$crate_dir/pkg/${stem}_bg.wasm"
            if [ -f "$base_file" ]; then
              base_size=$(stat --printf="%s" "$base_file")
              base_mb=$(echo "scale=2; $base_size / 1048576" | bc)
              delta=$(( pr_size - base_size ))
              pct=$(echo "scale=1; $delta * 100 / $base_size" | bc)
              delta_kb=$(echo "scale=1; $delta / 1024" | bc)
              sign=""; [ $delta -gt 0 ] && sign="+"
              rows="$rows| \`${stem}_bg.wasm\` | ${base_mb} MB | ${pr_mb} MB | ${sign}${delta_kb} KB (${sign}${pct}%) |"$'\n'
            else
              delta=$pr_size
              rows="$rows| \`${stem}_bg.wasm\` | (new) | ${pr_mb} MB | new module |"$'\n'
            fi
            [ "$stem" = remus_wasm ] && kernel_delta=$delta
          done
          {
            echo "COMMENT_BODY<<WASM_EOF"
            echo "## WASM Binary Size"
            echo ""
            echo "| File | main | PR | Delta |"
            echo "|------|------|----|-------|"
            printf '%s' "$rows"
            echo ""
            # Only the kernel module counts against the consumer's size policy;
            # the translator module loads lazily around import and export.
            if [ $kernel_delta -gt 51200 ]; then
              echo "⚠️ Kernel module grew by >50 KB. Please verify this is expected."
            elif [ $kernel_delta -gt 0 ]; then
              echo "⚠️ Kernel module grew slightly."
            elif [ $kernel_delta -eq 0 ]; then
              echo "✅ Kernel module unchanged."
            else
              echo "✅ Kernel module shrank — nice!"
            fi
            echo "WASM_EOF"
          } >> "$GITHUB_ENV"
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## WASM Binary Size"
      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ env.COMMENT_BODY }}
          edit-mode: replace

  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Audit the committed Cargo.lock — the resolution consumers actually
      # build — so a new dep release cannot fail an unrelated PR. New
      # advisories against the pinned versions still fail (the advisory DB
      # is fetched live), and dependabot bumps re-audit the updated lock.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

  docs:
    name: Documentation
    needs: [changes, owner-pr]
    if: needs.changes.outputs.docs == 'true' && needs.owner-pr.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: mdbook@0.4.52
      - run: mdbook build book

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a leak in an old commit still counts
      # gitleaks-action requires a license for organization-owned repositories.
      # Install the official CLI archive directly and verify it before use.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact keeps any match's secret material out of the job log.
      - run: gitleaks git --log-opts="--all" --redact .

  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, owner-pr, repo-policy, clippy, test, approx-census, platform-test, coverage, msrv, wasm, fuzz-check, render, deny, audit, docs, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
