name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Least privilege by default: jobs run with a read-only token unless they
# explicitly opt into more (e.g. the wasm-size PR comment job below).
permissions:
  contents: read

# rust-toolchain.toml pins the exact Rust version (1.96.0) and includes
# rustfmt, clippy, and the wasm32 target. Rustup auto-detects it, so most
# jobs don't need dtolnay/rust-toolchain.

jobs:
  checks:
    # A full suite occupies one admission slot; pending PRs must not evict each other.
    concurrency:
      group: remus-ci-suite
      queue: max
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: esaueng/remus/.github/workflows/fleet-ci.yml@d13e3f9fc39556366adbc83cfe30884f2a950fc0

  ci-pass:
    name: CI Pass
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete suite
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
