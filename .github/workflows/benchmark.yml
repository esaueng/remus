name: Benchmark

# Broad kernel-perf regression tracking (complements the deterministic O(N²)
# complexity guard in the Test job). Nightly on `main` it records a baseline + trend on
# the gh-pages branch; on a PR it compares against that baseline and comments
# only on a clear regression. Shared CI runners are noisy, so the alert
# threshold is loose and a regression never fails the build — it informs.
#
# Split into two jobs for safety: `bench` runs the PR-controlled `cargo bench`
# (which compiles arbitrary build scripts) with a read-only token and no
# persisted credentials, then hands the result to `publish` as an artifact.
# `publish` runs no untrusted code, so it can safely hold the write/comment
# token — a PR build script can never reach it.

on:
  schedule:
    - cron: "29 6 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Least privilege by default; each job opts into exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: benchmark-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:benchmark' && github.run_id || 'selected' }}
  # Supersede an in-flight run on a PR (only the latest commit matters), but let
  # nightly main baseline finish without interrupting it for a PR update.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bench:
    if: ${{ (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:benchmark') && (github.event.action != 'labeled' || github.event.label.name == 'ci:benchmark'))) }}
    name: Kernel perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no write token reachable by bench build scripts
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run kernel tracking benchmarks
        # `--output-format bencher` emits the libtest `bench:` lines (stdout)
        # that the `cargo` parser in `publish` understands; build noise stays on
        # stderr. `pipefail` so a bench failure fails the step despite the `tee`
        # (the default `bash -e` shell does NOT set it).
        #
        # Discard any criterion state restored from the cache first. In bencher
        # output mode criterion does not write `base/sample.json`, but it still
        # tries to READ it when the directory exists — and prints the resulting
        # error to STDOUT, splitting that benchmark's `test ... bench:` line in
        # two. The publish step's parser then finds no results at all and fails
        # the run. A cached `target/` from a previous build is enough to leave
        # those directories behind, so start from none.
        run: |
          set -o pipefail
          rm -rf target/criterion
          cargo bench -p remus-operations --bench boolean_tracking -- --output-format bencher | tee bench-output.txt
          cargo bench -p remus-math --bench nurbs_inner_loops -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p remus-math --bench intersection_inner_loops -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p remus-math --bench cdt_insertion -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p remus-algo --bench gfa_inner_loops -- --output-format bencher | tee -a bench-output.txt
          cargo bench -p remus-blend --features bench-internals --bench walker_steps -- --output-format bencher | tee -a bench-output.txt
          # Belt and braces: every `test` line must be a well-formed bencher
          # line. A split line still starts with `test`, so compare counts
          # rather than just asserting one match — otherwise a single corrupted
          # benchmark hides behind its clean neighbours and the failure
          # resurfaces in the publish job, far from its cause.
          total=$(grep -c '^test ' bench-output.txt)
          parsed=$(grep -cE '^test [^ ]+ \.\.\. bench: +[0-9,]+ ns/iter' bench-output.txt)
          echo "bencher lines: ${parsed}/${total}"
          test "$total" -gt 0 && test "$total" -eq "$parsed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-output
          path: bench-output.txt
          retention-days: 5

  publish:
    name: Publish benchmark
    needs: [bench]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the baseline to gh-pages (main only)
      pull-requests: write # comment on a regression (PR)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the steps below use their own token

      # github-action-benchmark stores its history on gh-pages and fails hard
      # (`couldn't find remote ref gh-pages`) if it is missing. Detect it, and
      # create an empty one on the first nightly/main dispatch so the action can
      # bootstrap. A PR that runs before that simply skips the compare below.
      - name: Detect benchmark baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create gh-pages baseline branch
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.baseline.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q -b gh-pages
          : > "$tmp/.nojekyll"
          git -C "$tmp" add .nojekyll
          git -C "$tmp" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m 'Initialize gh-pages for benchmark tracking'
          git -C "$tmp" push -q \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-output

      # Runs nightly on main (record/update the baseline) and on a PR only
      # once a baseline exists (compare). Skipping the PR case during bootstrap
      # keeps the job green instead of failing on the missing gh-pages ref.
      - name: Compare / store results
        if: (github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || steps.baseline.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Kernel perf
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ github.token }}
          # Record the baseline only on main; PRs compare without pushing.
          auto-push: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
          # Alert only on a clear 2x regression, and never fail the build on it —
          # comment for visibility instead (shared runners are noisy).
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
