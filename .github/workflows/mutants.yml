name: Mutation Testing

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Scheduled/dispatch-only workflow; read-only token is sufficient.
permissions:
  contents: read

jobs:
  checks:
    uses: esaueng/remus/.github/workflows/fleet-mutants.yml@d4d8f715fb870839f70939cc9dd7645d61727a96
    permissions:
      contents: read
      pull-requests: read
