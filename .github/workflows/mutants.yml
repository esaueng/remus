name: Mutation Testing

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Scheduled/dispatch-only workflow; read-only token is sufficient.
permissions:
  contents: read

jobs:
  checks:
    uses: esaueng/remus/.github/workflows/fleet-mutants.yml@6da8b6a0777bd3e4e9248397626dce0636dce4c7
    permissions:
      contents: read
      pull-requests: read
