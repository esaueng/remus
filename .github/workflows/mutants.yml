name: Mutation Testing

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Scheduled/dispatch-only workflow; read-only token is sufficient.
permissions:
  contents: read

# B19: the sharded callee plans the week's in-diff mutants once and splits
# them across a round-robin matrix sized by scripts/plan-mutation-shards.py,
# capped at one wave of 8 shards. A larger week is sampled: each shard runs a
# shuffled order until its budget expires. scripts/mutants-verdict.py reports
# missed mutants for triage and fails a shard only on a broken run (baseline
# not green, nothing examined, timed-out mutants, mutants left without an
# outcome by a run that ended before the budget, unreadable output). The
# per-mutant settings live in `.cargo/mutants.toml`, and both scripts and the
# config are read from the checkout, so tuning them needs no pin change.
#
# Pin rule (scripts/test-ubuntu-ci-routing.py): the pin must be a commit on
# main whose copy of the callee is byte-identical to the checked-in file. A PR
# that edits fleet-mutants-sharded-v5.yml therefore cannot re-pin to its own
# branch commit (it dangles after squash-merge, PR #499); land the callee
# change first, then re-pin to that squash commit in a follow-up, checking
# `git merge-base --is-ancestor <sha> origin/main` and the file content.
# Keep the callee commit when merging so this pin remains on main.
jobs:
  checks:
    uses: esaueng/remus/.github/workflows/fleet-mutants-sharded-v6.yml@ff8415b3005256df5a65af5c92b8c26caa4c878f
    permissions:
      contents: read
      pull-requests: read
