name: Mutation Testing

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Scheduled/dispatch-only workflow; read-only token is sufficient.
permissions:
  contents: read

jobs:
  mutants:
    name: Cargo Mutants
    runs-on: ubuntu-latest
    # The examined surface grew from ~48k lines (the math subset plus algo) to
    # ~122k when the blend, offset and operations crates were added, so the
    # budget is raised by rather more than the 2.5x line ratio: those crates
    # build and test more slowly per mutant than the numeric ones.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.62.30
        with:
          tool: nextest
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.0.0 --locked
      # The package list and mutants.toml's examine_globs INTERSECT: a glob for
      # a package not named here is silently inert. Adding the engine crates to
      # mutants.toml alone would have changed nothing.
      - name: Run mutation testing on critical modules
        run: |
          cargo mutants \
            --test-tool=nextest \
            --timeout=120 \
            --package remus-math \
            --package remus-algo \
            --package remus-blend \
            --package remus-offset \
            --package remus-operations \
            -e 'tests/**' \
            -e 'benches/**' \
            -e 'examples/**' \
            --output=mutants-output
      - name: Publish mutation summary
        if: always()
        run: |
          {
            echo "## Mutation testing"
            echo
            echo "| Outcome | Count |"
            echo "| --- | ---: |"
            for outcome in caught missed timeout unviable; do
              file="mutants-output/${outcome}.txt"
              if [ -f "$file" ]; then
                count=$(wc -l < "$file" | tr -d ' ')
              else
                count=0
              fi
              echo "| ${outcome} | ${count} |"
            done
            echo
            echo "Missed and timed-out mutants fail the cargo-mutants step and must be reviewed in the attached report."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report
          path: mutants-output/
          retention-days: 30
