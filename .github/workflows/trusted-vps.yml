name: Trusted fleet validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Trusted runner to validate
        type: choice
        default: auto
        options: [auto, ci-server-jane, ci-server-jane-1, ci-server-jane-2, ci-server-john]

permissions:
  contents: read

concurrency:
  group: trusted-vps-main
  cancel-in-progress: false

jobs:
  policy:
    name: Fleet policy probe (${{ matrix.probe }})
    # The variable is an activation switch, not an access control. The runner
    # group must separately allow this repository and this workflow on main.
    if: >-
      github.repository == 'esaueng/remus' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.REMUS_TRUSTED_VPS_ENABLED == 'true' &&
      ((vars.CI_FLEET_ENABLED == 'true' && contains(fromJSON('["ci-server-jane","ci-server-john"]'), vars.CI_FLEET_TARGET)) || contains(fromJSON('["ci-server-jane","ci-server-jane-1","ci-server-jane-2","ci-server-john"]'), inputs.runner))
    runs-on:
      group: ci-trusted-main
      labels: ${{ contains(fromJSON('["ci-server-jane","ci-server-jane-1","ci-server-jane-2","ci-server-john"]'), inputs.runner) && inputs.runner || vars.CI_FLEET_TARGET }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # The shared Jane label exercises both independent slots concurrently.
      max-parallel: 2
      matrix:
        probe: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify runner isolation and fresh storage
        run: |
          set -euo pipefail
          date -u +%FT%TZ
          case "$RUNNER_NAME" in
            ci-vm-1441561|ci-server-jane|ci-server-john)
              CI_USER=ci-runner CI_STORAGE=/srv/ci CI_SLICE=ci.slice
              CI_DOCKER=ci-docker CI_MEMORY=3221225472 CI_CPUS=1
              CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 ;;
            ci-server-jane-1|ci-server-jane-2)
              slot=${RUNNER_NAME##*-}
              CI_USER=ci-slot$slot CI_STORAGE=/srv/ci-slot$slot CI_SLICE=cislot$slot.slice
              CI_DOCKER=ci-slot$slot-docker CI_MEMORY=6442450944 CI_CPUS=6
              CARGO_BUILD_JOBS=3 RUST_TEST_THREADS=6 ;;
            *) echo 'Unknown trusted runner' >&2; exit 1 ;;
          esac
          CI_CGROUP=/sys/fs/cgroup/$CI_SLICE
          test "$(id -un)" = "$CI_USER"
          test "$(id -u)" != 0
          test "$HOME" = "$CI_STORAGE/home"
          test -f "/opt/$CI_USER/bin/Runner.Listener"
          test -f "/etc/systemd/system/$CI_USER.service"
          test ! -w "/opt/$CI_USER/bin/Runner.Listener"
          test "$(awk '/^NoNewPrivs:/ {print $2}' /proc/self/status)" = 1
          test ! -e "$HOME/.remus-ci-sentinel"
          test ! -e "$CI_STORAGE/work/.remus-ci-sentinel"
          touch "$HOME/.remus-ci-sentinel" "$CI_STORAGE/work/.remus-ci-sentinel"
          test "$DOCKER_HOST" = "unix:///run/$CI_DOCKER/docker.sock"
          docker info --format '{{json .SecurityOptions}}' | jq -e 'index("name=rootless") != null'
          test -z "$(docker ps --all --quiet)"
          test -z "$(docker image ls --quiet)"
          test "$(cat "$CI_CGROUP/memory.max")" = "$CI_MEMORY"
          test "$(cat "$CI_CGROUP/memory.swap.max")" = 0
          awk -v cpus="$CI_CPUS" '{exit !($1 == $2 * cpus)}' "$CI_CGROUP/cpu.max"
          grep -Fx "0::/$CI_SLICE/$CI_USER.service" /proc/self/cgroup
          case ",$(findmnt -n -o OPTIONS --mountpoint "$CI_STORAGE")," in
            *,nosuid,*) ;; *) exit 1 ;; esac
          {
            echo "CI_CGROUP=$CI_CGROUP"
            echo "CI_STORAGE=$CI_STORAGE"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
            echo "RUST_TEST_THREADS=$RUST_TEST_THREADS"
          } >> "$GITHUB_ENV"
          cat /proc/self/cgroup
          git --version
          python3 --version
          /usr/bin/time --version
          df -h "$CI_STORAGE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Layer boundaries
        run: /usr/bin/time -v ./scripts/check-boundaries.sh
      - name: CI classifier unit tests
        run: /usr/bin/time -v python3 scripts/test-classify-ci-changes.py
      - name: Allow concurrent slot observation
        if: github.event_name == 'workflow_dispatch' && inputs.runner == 'ci-server-jane'
        run: sleep 30
      - name: Record capacity evidence
        if: always()
        run: |
          set -euo pipefail
          {
            echo "Runner: $RUNNER_NAME; UID: $(id -u); commit: $GITHUB_SHA"
            date -u +%FT%TZ
            echo 'Command elapsed time and maximum RSS are in the check-step logs.'
            echo 'CI slice counters below may include earlier jobs; inspect host cleanup after completion.'
            for metric in memory.current memory.peak memory.events; do
              echo "$metric"
              cat "$CI_CGROUP/$metric"
            done
            du -sh "$HOME" "$GITHUB_WORKSPACE"
            df -h "$CI_STORAGE"
          } | tee -a "$GITHUB_STEP_SUMMARY"
