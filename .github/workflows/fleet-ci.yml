name: Trusted CI jobs
on:
  workflow_call:
    outputs:
      heavy:
        value: ${{ jobs.changes.outputs.heavy }}
      full:
        value: ${{ jobs.changes.outputs.full }}
      wasm:
        value: ${{ jobs.changes.outputs.wasm }}
permissions:
  contents: read
  pull-requests: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
jobs:
  changes:
    name: Classify Changes
    runs-on: &fleet-light-runner ${{ fromJSON((vars.CI_FLEET_ENABLED == 'true' || (vars.CI_FLEET_VALIDATION_REF != '' && vars.CI_FLEET_VALIDATION_REF == github.ref)) && (github.repository == 'esaueng/remus' && github.repository_id == '1334765869' && github.actor == 'petergstfsn' && github.actor_id == '171875562' && github.triggering_actor == 'petergstfsn' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.user.login == 'petergstfsn' && github.event.pull_request.user.id == 171875562 && github.event.pull_request.head.repo.id == 1334765869 && github.event.pull_request.base.repo.id == 1334765869 && github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.repo.fork == false && github.event.pull_request.base.ref == 'main' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.ref_protected == true))) && (vars.CI_FLEET_LIGHT_POOL_ENABLED == 'true' && (vars.CI_FLEET_TARGET == 'ci-server-jane' || vars.CI_FLEET_TARGET == 'ci-server-john') && '{"group":"ci-trusted-main","labels":["self-hosted","Linux","X64","ci-remus-light"]}' || vars.CI_FLEET_TARGET == 'ci-server-jane' && '{"group":"ci-trusted-main","labels":"ci-server-jane"}' || vars.CI_FLEET_TARGET == 'ci-server-john' && '{"group":"ci-trusted-main","labels":"ci-server-john"}') || '"ubuntu-latest"') }}
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      docs: ${{ steps.classify.outputs.docs }}
      full: ${{ steps.classify.outputs.full }}
      wasm: ${{ steps.classify.outputs.wasm }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - &fleet-source
        name: Check identity and immutable merge parents
        if: runner.environment == 'self-hosted' && github.event_name == 'pull_request'
        env:
          ENABLED: "true"
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          OWNER = "petergstfsn"
          OWNER_ID = 171875562
          REPOSITORY = "esaueng/remus"
          REPOSITORY_ID = 1334765869

          def valid_pr(pr):
              def same_repo(repo):
                  return (repo.get("id") == REPOSITORY_ID
                          and repo.get("full_name") == REPOSITORY
                          and repo.get("fork") is False)

              head = pr.get("head") or {}
              base = pr.get("base") or {}
              author = pr.get("user") or {}
              return (
                  pr.get("state") == "open"
                  and type(pr.get("number")) is int and pr["number"] > 0
                  and author.get("login") == OWNER and author.get("id") == OWNER_ID
                  and same_repo(head.get("repo") or {})
                  and same_repo(base.get("repo") or {})
                  and base.get("ref") == "main"
                  and all(re.fullmatch(r"[0-9a-f]{40}", str(side.get("sha", "")))
                          for side in (head, base))
              )

          def eligible(event, context):
              pr = event.get("pull_request") or {}
              sender = event.get("sender") or {}
              return (
                  context.get("ENABLED") == "true"
                  and context.get("EVENT_NAME") == "pull_request"
                  and context.get("REPOSITORY") == REPOSITORY
                  and context.get("REPOSITORY_ID") == str(REPOSITORY_ID)
                  and context.get("ACTOR") == OWNER
                  and context.get("ACTOR_ID") == str(OWNER_ID)
                  and context.get("TRIGGERING_ACTOR") == OWNER
                  and sender.get("login") == OWNER and sender.get("id") == OWNER_ID
                  and valid_pr(pr)
                  and context.get("REF") == f"refs/pull/{pr['number']}/merge"
                  and re.fullmatch(r"[0-9a-f]{40}", context.get("SHA", "")) is not None
              )

          def current_merge(event_pr, current_pr, commit, sha):
              return (
                  valid_pr(current_pr)
                  and current_pr["number"] == event_pr["number"]
                  and all(current_pr[side]["sha"] == event_pr[side]["sha"]
                          for side in ("head", "base"))
                  and commit.get("sha") == sha
                  and [parent.get("sha") for parent in commit.get("parents", [])]
                      == [event_pr["base"]["sha"], event_pr["head"]["sha"]]
              )

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{REPOSITORY}/{path}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"]) as stream:
                  event = json.load(stream)
              trusted = False
              if eligible(event, os.environ):
                  pr = event["pull_request"]
                  sha = os.environ["SHA"]
                  trusted = current_merge(pr, get(f"pulls/{pr['number']}"),
                                          get(f"commits/{sha}"), sha)
              if not trusted:
                  raise SystemExit("PR identity or merge parents no longer match")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"trusted={str(trusted).lower()}\n")
              print("Owner PR authorized for trusted fleet" if trusted else "Use hosted CI")

          if __name__ == "__main__":
              main()
          PY
      - &fleet-isolation
        name: Verify runner isolation and fresh storage
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          case "$RUNNER_NAME" in
            ci-vm-1441561|ci-server-jane|ci-server-john)
              CI_USER=ci-runner CI_STORAGE=/srv/ci CI_SLICE=ci.slice
              CI_DOCKER=ci-docker CI_MEMORY=3221225472 CI_CPUS=1
              CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 ;;
            ci-server-jane-1|ci-server-jane-2)
              slot=${RUNNER_NAME##*-}
              CI_USER=ci-slot$slot CI_STORAGE=/srv/ci-slot$slot CI_SLICE=cislot$slot.slice
              CI_DOCKER=ci-slot$slot-docker CI_MEMORY=6442450944 CI_CPUS=6
              CARGO_BUILD_JOBS=3 RUST_TEST_THREADS=6 ;;
            *) echo 'Unknown trusted runner' >&2; exit 1 ;;
          esac
          CI_CGROUP=/sys/fs/cgroup/$CI_SLICE
          test "$(id -un)" = "$CI_USER"
          test "$(id -u)" != 0
          test "$HOME" = "$CI_STORAGE/home"
          test -f "/opt/$CI_USER/bin/Runner.Listener"
          test -f "/etc/systemd/system/$CI_USER.service"
          test ! -w "/opt/$CI_USER/bin/Runner.Listener"
          test ! -w "/etc/systemd/system/$CI_USER.service"
          test "$(awk '/^NoNewPrivs:/ {print $2}' /proc/self/status)" = 1
          test ! -e "$HOME/.app-ci-sentinel"
          test ! -e "$CI_STORAGE/work/.app-ci-sentinel"
          touch "$HOME/.app-ci-sentinel" "$CI_STORAGE/work/.app-ci-sentinel"
          test "$DOCKER_HOST" = "unix:///run/$CI_DOCKER/docker.sock"
          docker info --format '{{json .SecurityOptions}}' | jq -e 'index("name=rootless") != null'
          test -z "$(docker ps --all --quiet)"
          test -z "$(docker image ls --quiet)"
          test "$(cat "$CI_CGROUP/memory.max")" = "$CI_MEMORY"
          test "$(cat "$CI_CGROUP/memory.swap.max")" = 0
          awk -v cpus="$CI_CPUS" '{exit !($1 == $2 * cpus)}' "$CI_CGROUP/cpu.max"
          grep -Fx "0::/$CI_SLICE/$CI_USER.service" /proc/self/cgroup
          case ",$(findmnt -n -o OPTIONS --mountpoint "$CI_STORAGE")," in
            *,nosuid,*) ;; *) exit 1 ;; esac
          {
            echo "CI_CGROUP=$CI_CGROUP"
            echo "CI_STORAGE=$CI_STORAGE"
            echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
            echo "RUST_TEST_THREADS=$RUST_TEST_THREADS"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify direct scheduling policy
        run: python3 scripts/test-direct-fleet.py
      - name: Classify changed paths
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          # The second tier (coverage, macOS, MSRV, fuzz compile, render,
          # deny, audit, package build) runs for every main push, merge
          # group and dispatch, and for PRs only with the `ci:full` label.
          FORCE_FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          base="${MERGE_BASE:-$PR_BASE}"
          if [ -z "$base" ]; then
            base="$PUSH_BASE"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          full_flag=""
          if [ "$FORCE_FULL" = "true" ]; then
            full_flag="--full"
          fi
          python3 scripts/classify-ci-changes.py \
            --base "$base" \
            --head "$GITHUB_SHA" $full_flag | tee -a "$GITHUB_OUTPUT"
      - name: Summarize selection
        env:
          MODE: ${{ steps.classify.outputs.mode }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: echo "CI mode is ${MODE} for ${CHANGED_COUNT} changed path(s)." >> "$GITHUB_STEP_SUMMARY"
  repo-policy:
    name: Repository Policy
    runs-on: *fleet-light-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &fleet-rust
        name: Install pinned Rust on disposable runners
        if: runner.environment == 'self-hosted'
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-machete@0.9.1,taplo-cli@0.9.3
      - name: Run repository policy checks
        shell: bash
        run: |
          status=0
          check() {
            label=$1
            shift
            echo "::group::${label}"
            "$@" || status=1
            echo "::endgroup::"
          }

          check "Apache lineage" ./scripts/check-apache-lineage.sh
          check "Rust format" cargo fmt --all -- --check
          check "Layer boundaries" ./scripts/check-boundaries.sh
          check "Deterministic hashing ratchet" ./scripts/check-det-hash.sh
          check "Edge-domain authority" ./scripts/check-edge-domain-authority.py
          check "Documentation paths" ./scripts/check-doc-paths.sh
          check "Documentation module map" ./scripts/check-doc-module-map.py
          check "Product naming" ./scripts/check-remus-rename.sh
          check "Publish workflow contract" ./scripts/test-publish-credentials.sh
          check "Gauntlet workflow contract" python3 scripts/test-gauntlet-workflow.py
          check "Owner PR policy tests" python3 scripts/test-owner-pr-policy.py
          check "Fleet selector tests" python3 scripts/test-fleet-selector.py
          check "Fleet runner policy tests" python3 scripts/test-fleet-runner-policy.py
          check "Owner PR routing tests" python3 scripts/test-owner-pr-routing.py
          check "CI convergence tests" python3 scripts/test-ci-convergence.py
          check "CI classifier tests" python3 scripts/test-classify-ci-changes.py
          check "Unused dependencies" cargo machete
          check "TOML format" taplo fmt --check
          exit "$status"
  test:
    name: Test
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: &fleet-runner ${{ fromJSON((vars.CI_FLEET_ENABLED == 'true' || (vars.CI_FLEET_VALIDATION_REF != '' && vars.CI_FLEET_VALIDATION_REF == github.ref)) && (github.repository == 'esaueng/remus' && github.repository_id == '1334765869' && github.actor == 'petergstfsn' && github.actor_id == '171875562' && github.triggering_actor == 'petergstfsn' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.user.login == 'petergstfsn' && github.event.pull_request.user.id == 171875562 && github.event.pull_request.head.repo.id == 1334765869 && github.event.pull_request.base.repo.id == 1334765869 && github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.repo.fork == false && github.event.pull_request.base.ref == 'main' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.ref_protected == true))) && (vars.CI_FLEET_TARGET == 'ci-server-jane' && '{"group":"ci-trusted-main","labels":"ci-server-jane"}' || vars.CI_FLEET_TARGET == 'ci-server-john' && '{"group":"ci-trusted-main","labels":"ci-server-john"}') || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.62.30
        with:
          tool: nextest
      # Lint first: a clippy failure is cheaper to report than a test run,
      # and both share the restored target directory on one runner slot.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --cargo-profile ci-test --test-threads "${RUST_TEST_THREADS:-num-cpus}"
      # nextest doesn't run doc tests, so run them separately
      - run: cargo test --workspace --profile ci-test --doc
      # Complexity-regression guards: deterministic work-counter tests that fail
      # if a boolean hot path regresses to O(N²) (issue #987). Gated behind the
      # `perf-counters` feature, so they need an explicit run.
      - name: Complexity guards
        run: cargo nextest run -p remus-operations --features perf-counters --cargo-profile ci-test -E 'test(scaling_)'
  approx-census:
    name: Approximation Census
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: *fleet-runner
    timeout-minutes: 15
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test census contract
        run: python3 scripts/check-approx-census.py --self-test
      - name: Compare approximation census
        run: python3 scripts/check-approx-census.py
  platform-test:
    name: Test (${{ matrix.os }})
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: nextest
      - run: cargo nextest run --workspace --cargo-profile ci-test --test-threads "${RUST_TEST_THREADS:-num-cpus}"
  coverage:
    name: Coverage
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: *fleet-runner
    env:
      CARGO_INCREMENTAL: "0"
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.62.30
        with:
          tool: cargo-llvm-cov,nextest
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --cargo-profile ci-test --no-report --test-threads "${RUST_TEST_THREADS:-num-cpus}"
          cargo llvm-cov report --profile ci-test --lcov --output-path lcov.info
          cargo llvm-cov report --profile ci-test --fail-under-lines 60
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: lcov.info
          use_oidc: true
  msrv:
    name: MSRV (1.88)
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: *fleet-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Override rust-toolchain.toml to test the declared minimum version.
      # Action SHA stays pinned; the Rust version is set explicitly below.
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # 1.88.0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      - run: cargo check --workspace --all-features
  wasm-no-io:
    name: WASM without optional I/O
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: *fleet-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: wasm-no-io
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build WASM without optional I/O
        run: |
          cargo clippy -p remus-wasm --target wasm32-unknown-unknown --no-default-features -- -D warnings
          cargo test -p remus-wasm --no-default-features --profile ci-test
  wasm:
    name: WASM Build & Validate
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.wasm == 'true'
    runs-on: *fleet-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - name: Install Node for WASM package validation
        if: runner.environment == 'self-hosted'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.62.30
        with:
          tool: wasm-pack
      - name: Build and validate WASM
        run: cargo xtask wasm-build
      - name: Prepare WASM size artifacts
        if: github.event_name == 'pull_request'
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          mkdir -p "$RUNNER_TEMP/wasm-size"
          # kernel module first, translator module second
          for crate_dir in crates/wasm crates/wasm-io; do
            wasm_package=$(jq -r '.packages[] | select(.manifest_path | endswith("/'"$crate_dir"'/Cargo.toml")) | .name' <<< "$metadata")
            wasm_target=$(jq -r '.packages[] | select(.name == $package) | .targets[] | select(.crate_types | index("cdylib")) | .name' --arg package "$wasm_package" <<< "$metadata")
            test -n "$wasm_target"
            cp "$crate_dir/pkg/${wasm_target}_bg.wasm" "$RUNNER_TEMP/wasm-size/pr-${wasm_target}.wasm"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: wasm-size-pr
          path: ${{ runner.temp }}/wasm-size/pr-*.wasm
          if-no-files-found: error
          retention-days: 1
      - name: Validate npm package contents
        run: |
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            (cd "$pkg" && npm pack --dry-run)
          done
      - name: W9 native and WASM preflight workflow
        run: bash scripts/test-w9-preflight.sh
      - name: Preserve W9 stage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: w9-preflight
          path: target/w9-preflight.json
          if-no-files-found: warn
  fuzz-check:
    name: Fuzz Targets Compile
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: *fleet-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins
  render:
    name: Software Rendering
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: *fleet-runner
    env:
      WGPU_BACKEND: vulkan
      REMUS_REQUIRE_WGPU_ADAPTER: "1"
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Mesa lavapipe
        run: |
          if [ "${{ runner.environment }}" != self-hosted ]; then
            sudo apt-get update
            sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
          fi
      - run: cargo test -p remus-render
  deny:
    name: Cargo Deny
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: *fleet-light-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check
  audit:
    name: Security Audit
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.full == 'true'
    runs-on: *fleet-light-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      # Audit the committed Cargo.lock — the resolution consumers actually
      # build — so a new dep release cannot fail an unrelated PR. New
      # advisories against the pinned versions still fail (the advisory DB
      # is fetched live), and dependabot bumps re-audit the updated lock.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
  docs:
    name: Documentation
    needs: [changes, repo-policy, secrets-scan]
    if: needs.changes.outputs.docs == 'true'
    runs-on: *fleet-light-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fleet-rust
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: mdbook@0.4.52
      - run: mdbook build book
  secrets-scan:
    name: Secrets Scan
    runs-on: *fleet-light-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — a leak in an old commit still counts
      # gitleaks-action requires a license for organization-owned repositories.
      # Install the official CLI archive directly and verify it before use.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact keeps any match's secret material out of the job log.
      - run: gitleaks git --log-opts="--all" --redact .
  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, repo-policy, test, approx-census, platform-test, coverage, msrv, wasm, wasm-no-io, fuzz-check, render, deny, audit, docs, secrets-scan]
    runs-on: *fleet-light-runner
    steps:
      - *fleet-source
      - *fleet-isolation
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          DOCS: ${{ needs.changes.outputs.docs }}
          FULL: ${{ needs.changes.outputs.full }}
          WASM: ${{ needs.changes.outputs.wasm }}
        run: |
          # A skipped job passes only when the classifier deselected its
          # tier: docs by `docs`, the package build by `wasm`, the second
          # tier by `full`, and the PR tier by `heavy`.
          echo "$NEEDS" | jq -e --arg heavy "$HEAVY" --arg docs "$DOCS" --arg full "$FULL" --arg wasm "$WASM" '
            ($heavy == "true" or $heavy == "false") and
            ($docs == "true" or $docs == "false") and
            ($full == "true" or $full == "false") and
            ($wasm == "true" or $wasm == "false") and
            (($heavy == "true") or ($full == "false" and $wasm == "false")) and
            (.changes.result == "success") and
            (."repo-policy".result == "success") and
            (."secrets-scan".result == "success") and
            (to_entries | all(
              .value.result == "success" or
              (.value.result == "skipped" and
               (.key as $job |
                if $job == "docs" then $docs == "false"
                elif $job == "wasm" then $wasm == "false"
                elif (["platform-test", "coverage", "msrv", "fuzz-check", "render", "deny", "audit"] | index($job)) != null then $full == "false"
                else $heavy == "false" end))
            ))' > /dev/null
