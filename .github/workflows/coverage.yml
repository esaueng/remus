name: Nightly Coverage

on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: nightly-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage
    if: github.repository == 'esaueng/remus' && github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage-sharded.yml
