name: Fast native suite proof
on:
  pull_request:
    paths:
      - scripts/ci_native.py
      - scripts/ci_coverage.py
      - scripts/ci_gate.py
      - scripts/test_coverage_archive.py
      - scripts/test_coverage_scheduling.py
      - .config/nextest.toml
      - scripts/classify-ci-daily.py
      - scripts/test_ci_daily.py
      - .github/ci-test-suites.json
      - .github/workflows/fleet-ci-v12.yml
      - .github/workflows/ci-daily-proof.yml
      - .github/workflows/coverage-sharded.yml
      - .github/workflows/daily-validation.yml
permissions:
  contents: read
concurrency:
  group: fast-native-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          prefix-key: v1-native-workspace
          save-if: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: nextest@0.9.150
      - run: python3 scripts/test_ci_daily.py
      - run: python3 scripts/ci_native.py plan --base HEAD^ --smoke --plan "$RUNNER_TEMP/native-plan.json"
      - run: python3 scripts/check-native-test-workspace.py --record "$RUNNER_TEMP/native-test-workspace.json"
      - run: python3 scripts/ci_native.py archive --plan "$RUNNER_TEMP/native-plan.json" --archive "$RUNNER_TEMP/native-tests.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-native-proof
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-plan.json
            ${{ runner.temp }}/native-test-workspace.json
            ${{ runner.temp }}/native-tests.tar.zst
          if-no-files-found: error
          retention-days: 1
  partitions:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: nextest@0.9.150
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fast-native-proof
          path: ${{ runner.temp }}
      - run: python3 scripts/check-native-test-workspace.py "$RUNNER_TEMP/native-test-workspace.json"
      - env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci_native.py run --plan "$RUNNER_TEMP/native-plan.json" --archive "$RUNNER_TEMP/native-tests.tar.zst" --shard "$SHARD" --total 4
  coverage-archive-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.150
      - run: python3 scripts/test_coverage_archive.py
      - run: python3 scripts/test_coverage_scheduling.py
  coverage-budget-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXTEST_PROFILE: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.150
      - name: Build the real budget-sensitive instrumented test binary
        run: cargo llvm-cov nextest-archive --package remus-operations --test op_seq_81 --cargo-profile ci-test --locked --archive-file "$RUNNER_TEMP/budget-tests.tar.zst"
      - name: Verify the complete sphere-box oracle within its existing budget
        run: cargo llvm-cov nextest --archive-file "$RUNNER_TEMP/budget-tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --no-report --test-threads 2 -E 'binary(=op_seq_81) & test(=finding_sphere_minus_box_open_mesh)'
