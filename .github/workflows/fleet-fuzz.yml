name: Trusted fuzz
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
env:
  CARGO_TERM_COLOR: always
jobs:
  prepare-cargo-fuzz:
    name: Prepare cargo-fuzz
    runs-on: &fleet-runner ${{ fromJSON((vars.CI_FLEET_ENABLED == 'true' || (vars.CI_FLEET_VALIDATION_REF != '' && vars.CI_FLEET_VALIDATION_REF == github.ref)) && (github.repository == 'esaueng/remus' && github.repository_id == '1334765869' && github.actor == 'petergstfsn' && github.actor_id == '171875562' && github.triggering_actor == 'petergstfsn' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.user.login == 'petergstfsn' && github.event.pull_request.user.id == 171875562 && github.event.pull_request.head.repo.id == 1334765869 && github.event.pull_request.base.repo.id == 1334765869 && github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.repo.fork == false && github.event.pull_request.base.ref == 'main' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.ref_protected == true))) && (vars.CI_FLEET_TARGET == 'ci-server-jane' && '{"group":"ci-trusted-main","labels":"ci-server-jane"}' || vars.CI_FLEET_TARGET == 'ci-server-john' && '{"group":"ci-trusted-main","labels":"ci-server-john"}') || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: esaueng/remus/.github/actions/fleet-guard@29779e3185e8582b59bf58692a307b1018a98e68
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # nightly
        with:
          toolchain: nightly
      - name: Install cargo-fuzz once
        run: |
          cargo +nightly install cargo-fuzz --locked
          mkdir -p "$RUNNER_TEMP/cargo-fuzz"
          cp "$HOME/.cargo/bin/cargo-fuzz" "$RUNNER_TEMP/cargo-fuzz/cargo-fuzz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-fuzz
          path: ${{ runner.temp }}/cargo-fuzz/cargo-fuzz
          if-no-files-found: error
          retention-days: 1

  # The reader targets hunt a panic on malformed input. The engine targets hunt
  # a different animal — a well-formed, confident, wrong solid — and a failure
  # there is a correctness bug, not a robustness one. They share a job shape but
  # not a purpose.
  targets:
    name: ${{ matrix.target }}
    needs: [prepare-cargo-fuzz]
    runs-on: *fleet-runner
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - step_reader
          - iges_reader
          - stl_reader
          - obj_reader
          - ply_reader
          - glb_reader
          - threemf_reader
          - boolean_tree
          - modifier_ops
          - nurbs_surface
          - topology_mutation
          - arena_roundtrip
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: esaueng/remus/.github/actions/fleet-guard@29779e3185e8582b59bf58692a307b1018a98e68
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-fuzz
          path: ${{ runner.temp }}/cargo-fuzz
      - name: Add cargo-fuzz to PATH
        run: |
          chmod +x "$RUNNER_TEMP/cargo-fuzz/cargo-fuzz"
          echo "$RUNNER_TEMP/cargo-fuzz" >> "$GITHUB_PATH"
      - name: Run bounded smoke fuzzing
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=2048
      # libFuzzer writes the crashing input under fuzz/artifacts/<target>/;
      # without this upload the only trace of a finding is the panic line in
      # the log, and the input itself is lost with the runner.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
