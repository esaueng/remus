name: Mutation Scope

on:
  pull_request:
    paths:
      - '.cargo/mutants.toml'
      - 'mutants.toml'
      - 'crates/math/**'
      - 'scripts/test-mutants-scope.py'
      - '.github/workflows/mutants.yml'
      - 'scripts/mutants-verdict.py'
      - 'scripts/plan-mutation-shards.py'
      - 'scripts/test-mutants-verdict.py'
      # The long-tail tests .cargo/mutants.toml excludes by exact name.
      - 'crates/operations/tests/regress_seam_split_rim_band_mesh.rs'
      - 'crates/operations/tests/pclass_torus_sphere_seams.rs'
      - '.github/workflows/mutation-scope.yml'
  push:
    branches: [main]
    paths:
      - '.cargo/mutants.toml'
      - 'mutants.toml'
      - 'crates/math/**'
      - 'scripts/test-mutants-scope.py'
      - '.github/workflows/mutants.yml'
      - 'scripts/mutants-verdict.py'
      - 'scripts/plan-mutation-shards.py'
      - 'scripts/test-mutants-verdict.py'
      # The long-tail tests .cargo/mutants.toml excludes by exact name.
      - 'crates/operations/tests/regress_seam_split_rim_band_mesh.rs'
      - 'crates/operations/tests/pclass_torus_sphere_seams.rs'
      - '.github/workflows/mutation-scope.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scope:
    name: Mutation Scope Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.0.0
      - run: python3 scripts/test-mutants-scope.py
