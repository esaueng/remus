name: Mutation Scope

on:
  pull_request:
    paths:
      - '.cargo/mutants.toml'
      - 'mutants.toml'
      - 'crates/math/**'
      - 'scripts/test-mutants-scope.py'
      - '.github/workflows/mutants.yml'
      - '.github/workflows/fleet-mutants.yml'
      - '.github/workflows/fleet-mutation-scope.yml'
      - '.github/actions/fleet-guard/**'
      - '.github/workflows/mutation-scope.yml'
  push:
    branches: [main]
    paths:
      - '.cargo/mutants.toml'
      - 'mutants.toml'
      - 'crates/math/**'
      - 'scripts/test-mutants-scope.py'
      - '.github/workflows/mutants.yml'
      - '.github/workflows/fleet-mutants.yml'
      - '.github/workflows/fleet-mutation-scope.yml'
      - '.github/actions/fleet-guard/**'
      - '.github/workflows/mutation-scope.yml'

permissions:
  contents: read

jobs:
  checks:
    uses: esaueng/remus/.github/workflows/fleet-mutation-scope.yml@34afb42bd5e3399556d85288de7a55889ae9306d
    permissions:
      contents: read
      pull-requests: read
