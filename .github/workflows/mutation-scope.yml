name: Mutation Scope

on:
  pull_request:
    paths:
      - '.cargo/mutants.toml'
      - 'mutants.toml'
      - 'crates/math/**'
      - 'scripts/test-mutants-scope.py'
      - '.github/workflows/mutants.yml'
      - '.github/workflows/fleet-mutants-sharded-v5.yml'
      - 'scripts/mutants-verdict.py'
      - 'scripts/plan-mutation-shards.py'
      - 'scripts/test-mutants-verdict.py'
      # The long-tail tests .cargo/mutants.toml excludes by exact name.
      - 'crates/operations/tests/regress_seam_split_rim_band_mesh.rs'
      - 'crates/operations/tests/pclass_torus_sphere_seams.rs'
      - '.github/workflows/fleet-mutation-scope-v4.yml'
      - '.github/actions/fleet-guard/**'
      - '.github/workflows/mutation-scope.yml'
  push:
    branches: [main]
    paths:
      - '.cargo/mutants.toml'
      - 'mutants.toml'
      - 'crates/math/**'
      - 'scripts/test-mutants-scope.py'
      - '.github/workflows/mutants.yml'
      - '.github/workflows/fleet-mutants-sharded-v5.yml'
      - 'scripts/mutants-verdict.py'
      - 'scripts/plan-mutation-shards.py'
      - 'scripts/test-mutants-verdict.py'
      # The long-tail tests .cargo/mutants.toml excludes by exact name.
      - 'crates/operations/tests/regress_seam_split_rim_band_mesh.rs'
      - 'crates/operations/tests/pclass_torus_sphere_seams.rs'
      - '.github/workflows/fleet-mutation-scope-v4.yml'
      - '.github/actions/fleet-guard/**'
      - '.github/workflows/mutation-scope.yml'

permissions:
  contents: read

jobs:
  checks:
    uses: esaueng/remus/.github/workflows/fleet-mutation-scope-v5.yml@ff8415b3005256df5a65af5c92b8c26caa4c878f
    permissions:
      contents: read
      pull-requests: read
