name: CI checks
# Every job behind the required `checks / CI Pass` context. ci.yml calls this
# file from the same commit, so a change here takes effect in its own PR.
#
# Classify Changes selects the tiers (scripts/classify-ci-changes.py); every
# other job starts as soon as it finishes. CI Pass fails unless each selected
# job succeeded (scripts/ci_gate.py).
on:
  workflow_call:
    inputs:
      coverage:
        type: boolean
        default: false
    outputs:
      heavy:
        value: ${{ jobs.changes.outputs.heavy }}
      full:
        value: ${{ jobs.changes.outputs.full }}
      wasm:
        value: ${{ jobs.changes.outputs.wasm }}
permissions:
  contents: read
  pull-requests: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
# rust-toolchain.toml pins the Rust version with rustfmt, clippy and the wasm32
# target; rustup installs it on first use, so jobs need no toolchain step.
jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
      docs: ${{ steps.classify.outputs.docs }}
      full: ${{ steps.classify.outputs.full }}
      coverage: ${{ steps.classify.outputs.coverage }}
      wasm: ${{ steps.classify.outputs.wasm }}
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Classify changed paths
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          COVERAGE_REQUESTED: ${{ (inputs.coverage || contains(github.event.pull_request.labels.*.name, 'ci:coverage')) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          # The default shell lacks pipefail, so a classifier failure would
          # otherwise hide behind tee's success and leave the outputs unset.
          set -o pipefail
          base="${MERGE_BASE:-$PR_BASE}"
          if [ -z "$base" ]; then
            base="$PUSH_BASE"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base=$(git rev-parse HEAD^)
          fi
          full_flag=""
          if [ "$FORCE_FULL" = "true" ]; then
            full_flag="--full"
          fi
          python3 scripts/classify-ci-changes.py \
            --base "$base" \
            --head "$GITHUB_SHA" $full_flag | tee -a "$GITHUB_OUTPUT"
      - name: Summarize selection
        env:
          MODE: ${{ steps.classify.outputs.mode }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: echo "CI mode is ${MODE} for ${CHANGED_COUNT} changed path(s)." >> "$GITHUB_STEP_SUMMARY"
  repo-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete@0.9.1,taplo-cli@0.9.3
      - name: Run repository policy checks
        run: python3 scripts/ci_preflight.py
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — a leak in an old commit still counts
      # gitleaks-action requires a license for organization-owned repositories.
      # Install the official CLI archive directly and verify it before use.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact keeps any match's secret material out of the job log.
      - run: gitleaks git --log-opts="--all" --redact .
  test:
    # Builds the complete native suite once; the partitions below run it.
    name: Test
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          prefix-key: v1-native-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@0.9.150
      # Compiled CARGO_MANIFEST_DIR fixture paths must match on every worker.
      - name: Record compiled fixture workspace and source
        run: python3 scripts/check-native-test-workspace.py --record "$RUNNER_TEMP/native-test-workspace.json"
      - name: Build the native test archive
        run: python3 scripts/ci_native.py archive --archive "$RUNNER_TEMP/native-tests.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-tests.tar.zst
            ${{ runner.temp }}/native-test-workspace.json
          if-no-files-found: error
          retention-days: 1
      # nextest doesn't run doc tests, so run them separately
      - run: cargo test --workspace --profile ci-test --doc
  test-shards:
    name: Native tests (${{ matrix.shard }}/8)
    needs: [changes, test]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@0.9.150
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-tests
          path: ${{ runner.temp }}
      - name: Verify the compiled fixture workspace and source
        run: python3 scripts/check-native-test-workspace.py "$RUNNER_TEMP/native-test-workspace.json"
      - name: Run this partition of the native suite
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/ci_native.py run --archive "$RUNNER_TEMP/native-tests.tar.zst" --shard "$SHARD" --total 8
  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          prefix-key: v1-native-workspace
          save-if: false
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The native test build compiles no examples; link them here.
      - name: Link examples
        run: cargo build --workspace --examples --locked
  complexity-guards:
    # Deterministic work-counter tests that fail if a boolean hot path
    # regresses to O(N²) (issue #987). They need the `perf-counters` feature
    # and so their own build.
    name: Complexity Guards
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: nextest@0.9.150
      - name: Complexity guards
        run: cargo nextest run -p remus-operations --features perf-counters --cargo-profile ci-test -E 'test(scaling_)'
  approx-census:
    name: Approximation Census
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test census contract
        run: python3 scripts/check-approx-census.py --self-test
      - name: Compare approximation census
        run: python3 scripts/check-approx-census.py
  coverage:
    name: Coverage
    needs: changes
    # The job holds id-token: write, which lets any process in it mint this
    # repo's OIDC tokens. Never run it on fork-PR code.
    if: ${{ needs.changes.outputs.coverage == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1,nextest@0.9.150
      - name: Generate coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --cargo-profile ci-test --no-report
          cargo llvm-cov report --profile ci-test --lcov --output-path lcov.info
          cargo llvm-cov report --profile ci-test --fail-under-lines 60
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          files: lcov.info
          use_oidc: true
  msrv:
    name: MSRV (1.88)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # rust-toolchain.toml pins the development toolchain and wins over the
    # rustup default, so installing 1.88.0 alone is not enough. RUSTUP_TOOLCHAIN
    # outranks the file for every rustup-proxied command in this job, including
    # the rustc version rust-cache keys on.
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The master-line commit, which takes a `toolchain` input. The action's
      # per-version branches hard-code their release and ignore `toolchain:`
      # with only a warning.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: msrv
      - name: Check the workspace on the declared MSRV
        run: |
          set -euo pipefail
          rustc --version
          if ! rustc --version | grep -q '^rustc 1\.88\.0 '; then
            echo "::error::MSRV job resolved $(rustc --version), not Rust 1.88.0"
            exit 1
          fi
          cargo +1.88.0 check --workspace --all-features
  wasm-no-io:
    name: WASM without optional I/O
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: wasm-no-io
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build WASM without optional I/O
        run: |
          cargo clippy -p remus-wasm --target wasm32-unknown-unknown --no-default-features -- -D warnings
          cargo test -p remus-wasm --no-default-features --profile ci-test
  wasm:
    name: WASM Build & Validate
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: wasm-package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-pack@0.15.0
      - name: Mark the WASM build start
        run: touch "$RUNNER_TEMP/wasm-build-start"
      - name: Build and validate WASM
        run: cargo xtask wasm-build --defer-package-tests
      - name: Prepare WASM size artifacts
        id: size-artifacts
        # Also after a failed build: a kernel over a hard limit fails
        # `validate_output` after it is built, and the size report must still
        # show it. Only modules this run wrote count; the packages committed
        # in the checkout are never reported as the PR build.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          marker="$RUNNER_TEMP/wasm-build-start"
          if [ ! -f "$marker" ]; then
            echo "::notice::The WASM build did not start; no size artifacts."
            exit 0
          fi
          metadata=$(cargo metadata --no-deps --format-version 1)
          mkdir -p "$RUNNER_TEMP/wasm-size"
          # kernel module first, translator module second
          for crate_dir in crates/wasm crates/wasm-io; do
            wasm_package=$(jq -r '.packages[] | select(.manifest_path | endswith("/'"$crate_dir"'/Cargo.toml")) | .name' <<< "$metadata")
            wasm_target=$(jq -r '.packages[] | select(.name == $package) | .targets[] | select(.crate_types | index("cdylib")) | .name' --arg package "$wasm_package" <<< "$metadata")
            test -n "$wasm_target"
            built="$crate_dir/pkg/${wasm_target}_bg.wasm"
            if [ -f "$built" ] && [ "$built" -nt "$marker" ]; then
              cp "$built" "$RUNNER_TEMP/wasm-size/pr-${wasm_target}.wasm"
            elif [ "$crate_dir" = crates/wasm ]; then
              echo "::notice::No kernel module was built; no size artifacts."
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.size-artifacts.outputs.ready == 'true' }}
        with:
          name: wasm-size-pr
          path: ${{ runner.temp }}/wasm-size/pr-*.wasm
          if-no-files-found: error
          retention-days: 1
      - name: Validate npm package contents
        run: |
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            (cd "$pkg" && npm pack --dry-run)
          done
      - name: Stamp stable package provenance
        run: |
          for pkg in crates/wasm/pkg crates/wasm-io/pkg; do
            npm --prefix "$pkg" pkg set repository.type=git repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git homepage=https://github.com/${GITHUB_REPOSITORY}
          done
      - name: Archive the packages for runtime checks and publishing
        run: /usr/bin/tar -czf "$RUNNER_TEMP/committed-wasm-package.tar.gz" crates/wasm/pkg crates/wasm-io/pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: committed-wasm-package
          compression-level: 0
          path: ${{ runner.temp }}/committed-wasm-package.tar.gz
          if-no-files-found: error
          retention-days: 1
  wasm-runtime:
    # Each suite runs as parts in parallel (scripts/packaged-suite-parts.mjs):
    # these jobs follow the 11-minute package build on the longest CI path.
    name: WASM runtime (${{ matrix.suite }} ${{ matrix.part }}/3)
    needs: [changes, wasm]
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, tarball-consumer]
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: committed-wasm-package
          path: ${{ runner.temp }}
      - name: Install only the generated package files
        run: python3 scripts/install-wasm-package-archive.py "$RUNNER_TEMP/committed-wasm-package.tar.gz" crates/wasm/pkg crates/wasm-io/pkg
      - name: Run the complete package suite
        env:
          SUITE: ${{ matrix.suite }}
          REMUS_PACKAGE_SUITE_PART: ${{ matrix.part }}/3
        run: |
          case "$SUITE" in
            smoke|tarball-consumer) node "scripts/test-wasm-$SUITE.mjs" ;;
            *) echo 'Unknown package suite' >&2; exit 1 ;;
          esac
  w9-preflight:
    # W9 builds its own native example and dev WASM package with the
    # `workflow-probes` feature and reads nothing the package build writes.
    name: W9 Preflight
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-pack@0.15.0
      - name: W9 native and WASM preflight workflow
        run: bash scripts/test-w9-preflight.sh
      - name: Preserve W9 stage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w9-preflight
          path: target/w9-preflight.json
          if-no-files-found: warn
  wasm-size-gate:
    # W1 of docs/design/kernel-wasm-size-architecture.md, inside CI Pass: the
    # PR kernel stays within the hard limits of scripts/wasm-size-policy.mjs,
    # and a kernel growth above 64 KiB raw needs a `WASM-Size:` line in the PR
    # description. Read-only: it runs the BASE commit's scripts on the PR's
    # built modules (data); ci.yml's wasm-size job posts the same report.
    name: WASM Size Gate
    needs: [changes, wasm]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-size-pr
          path: ${{ runner.temp }}/wasm-size
      - name: Enforce the kernel size policy and growth review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Bootstrap: a base from before the gate has no script to trust yet.
          if [ ! -f scripts/wasm-size-gate.mjs ]; then
            echo "::notice::The base commit predates scripts/wasm-size-gate.mjs; the size gate applies from the next base."
            exit 0
          fi
          report="$RUNNER_TEMP/wasm-size-report.md"
          status=0
          node scripts/wasm-size-gate.mjs --github-pr-body --base-dir . \
            --pr-dir "$RUNNER_TEMP/wasm-size" --markdown "$report" || status=$?
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 0 pass, 1 policy or growth failure, anything else a measurement error.
          exit "$status"
  fuzz-check:
    name: Fuzz Targets Compile
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins
  render:
    name: Software Rendering
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WGPU_BACKEND: vulkan
      REMUS_REQUIRE_WGPU_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
      - run: cargo test -p remus-render
  deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check
  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Audit the committed Cargo.lock — the resolution consumers actually
      # build — so a new dep release cannot fail an unrelated PR. New
      # advisories against the pinned versions still fail (the advisory DB
      # is fetched live), and dependabot bumps re-audit the updated lock.
      #
      # `cargo audit` fails on a vulnerability and prints informational
      # advisories (unsound, unmaintained, yanked) without failing. The
      # rustsec/audit-check action did the same, but reported a warning by
      # creating a check run, which this job's read-only token cannot do, so
      # any informational advisory failed the job.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.23.0
      - run: cargo audit
  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: mdbook@0.4.52
      - run: mdbook build book
  ci-pass:
    name: CI Pass
    if: always()
    needs: [changes, repo-policy, secrets-scan, test, test-shards, clippy, complexity-guards, approx-census, coverage, msrv, wasm, wasm-runtime, w9-preflight, wasm-size-gate, wasm-no-io, fuzz-check, render, deny, audit, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_gate.py
          sparse-checkout-cone-mode: false
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          DOCS: ${{ needs.changes.outputs.docs }}
          FULL: ${{ needs.changes.outputs.full }}
          COVERAGE: ${{ needs.changes.outputs.coverage }}
          WASM: ${{ needs.changes.outputs.wasm }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py
