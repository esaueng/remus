name: Build OpenZCAD WASM Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build fork package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: wasm-pack

      - name: Build and validate WASM package
        run: cargo xtask wasm-build --skip-opt

      - name: Stamp fork provenance
        working-directory: crates/wasm/pkg
        run: |
          npm pkg set \
            repository.type=git \
            repository.url=git+https://github.com/esaueng/remus.git \
            homepage=https://github.com/esaueng/remus \
            remusSourceCommit="$GITHUB_SHA"

      - name: Pack npm-compatible artifact
        id: pack
        working-directory: crates/wasm/pkg
        run: |
          package_name=$(npm pack --pack-destination "$RUNNER_TEMP")
          echo "path=$RUNNER_TEMP/$package_name" >> "$GITHUB_OUTPUT"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Upload validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
