name: Daily dependency validation
on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every main push already runs the complete native suite and clippy
  # (ci-checks.yml). This workflow covers what changes without a push: new
  # advisories against the committed lockfile, and the declared MSRV.
  dependencies:
    if: github.repository == 'esaueng/remus' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.23.0
      - run: cargo deny --all-features check
      # Fails on a vulnerability; informational advisories are printed only.
      - run: cargo audit
  msrv:
    if: github.repository == 'esaueng/remus' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88.0"
      - run: cargo +1.88.0 check --workspace --all-features --locked
