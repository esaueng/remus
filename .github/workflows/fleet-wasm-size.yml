name: Trusted wasm-size
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
env:
  CARGO_TERM_COLOR: always
jobs:
  wasm-size:
    name: WASM Size Report
    runs-on: ${{ fromJSON((vars.CI_FLEET_ENABLED == 'true' || (vars.CI_FLEET_VALIDATION_REF != '' && vars.CI_FLEET_VALIDATION_REF == github.ref)) && (github.repository == 'esaueng/remus' && github.repository_id == '1334765869' && github.actor == 'petertoday' && github.actor_id == '171875562' && github.triggering_actor == 'petertoday' && ((github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.user.login == 'petertoday' && github.event.pull_request.user.id == 171875562 && github.event.pull_request.head.repo.id == 1334765869 && github.event.pull_request.base.repo.id == 1334765869 && github.event.pull_request.head.repo.fork == false && github.event.pull_request.base.repo.fork == false && github.event.pull_request.base.ref == 'main' && github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number)) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.ref_protected == true))) && (vars.CI_FLEET_TARGET == 'ci-server-jane' && '{"group":"ci-trusted-main","labels":"ci-server-jane"}' || vars.CI_FLEET_TARGET == 'ci-server-john' && '{"group":"ci-trusted-main","labels":"ci-server-john"}') || '"ubuntu-24.04"') }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: esaueng/remus/.github/actions/fleet-guard@d95ff3b87c78f62ce42b31fdef26b7e6e69c807e
      # This job can write PR comments, so it runs only the BASE commit's
      # scripts; the PR's built modules and description are data. The same
      # report gates CI Pass through fleet-ci.yml's wasm-size-gate job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The caller also runs this job when CI failed, so the comment never
      # goes stale; without a PR build (the package job failed) it reports
      # nothing and CI Pass carries the failure.
      - id: artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: wasm-size-pr
          path: ${{ runner.temp }}/wasm-size
      - name: Measure the kernel against the size policy
        id: gate
        if: steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          report="$RUNNER_TEMP/wasm-size-report.md"
          # Bootstrap: a base from before the gate has no script to trust yet,
          # so report the kernel's raw bytes only and enforce nothing.
          if [ ! -f scripts/wasm-size-gate.mjs ]; then
            base_size=$(( $(wc -c < crates/wasm/pkg/remus_wasm_bg.wasm) ))
            pr_size=$(( $(wc -c < "$RUNNER_TEMP/wasm-size/pr-remus_wasm.wasm") ))
            {
              echo "## WASM Binary Size"
              echo ""
              echo "Kernel \`remus_wasm_bg.wasm\` raw: ${base_size} B (base) → ${pr_size} B (PR), delta $(( pr_size - base_size )) B."
              echo ""
              echo "The base commit predates \`scripts/wasm-size-gate.mjs\`, so this report has raw bytes only and enforces nothing."
            } > "$report"
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          node scripts/wasm-size-gate.mjs --github-pr-body --base-dir . \
            --pr-dir "$RUNNER_TEMP/wasm-size" --markdown "$report" || status=$?
          # 0 pass, 1 policy or growth failure (reported, then enforced
          # below), anything else a measurement error that fails here.
          case "$status" in
            0|1) ;;
            *) exit "$status" ;;
          esac
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Find existing comment
        if: steps.gate.outcome == 'success'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## WASM Binary Size"
      - name: Post or update comment
        if: steps.gate.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ runner.temp }}/wasm-size-report.md
          edit-mode: replace
      - name: Enforce the size policy
        if: steps.gate.outputs.status == '1'
        run: |
          echo "::error::The PR kernel fails the size policy or its growth review; see the WASM Binary Size comment."
          exit 1
