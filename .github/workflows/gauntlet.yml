name: Corpus Gauntlet

on:
  schedule:
    # The daily run is the 50-model smoke tier. Sunday also receives the
    # independent weekly abc-1k run thirty minutes later.
    - cron: "17 3 * * *"
    - cron: "47 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Corpus manifest tier
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - abc-1k

# The corpus runner compiles repository code, so it never receives a write
# token. Only the separate publisher can update the dedicated results branch.
permissions: {}

concurrency:
  group: gauntlet-results
  cancel-in-progress: false

# The ratchet allowance (MAX_STAGE_DROP_BPS) lives in the called workflow:
# a caller's `env` does not reach a reusable workflow.
jobs:
  checks:
    uses: esaueng/remus/.github/workflows/fleet-gauntlet-v5.yml@ff8415b3005256df5a65af5c92b8c26caa4c878f
    permissions:
      contents: write
      pull-requests: read
    with:
      # The weekly cron above selects abc-1k here, beside its schedule line.
      tier: ${{ github.event.schedule == '47 3 * * 0' && 'abc-1k' || inputs.tier || 'smoke' }}
