name: Corpus Gauntlet

on:
  schedule:
    # The daily run is the 50-model smoke tier. Sunday also receives the
    # independent weekly abc-1k run thirty minutes later.
    - cron: "17 3 * * *"
    - cron: "47 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: Corpus manifest tier
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - abc-1k

# The corpus runner compiles repository code, so it never receives a write
# token. Only the separate publisher can update the dedicated results branch.
permissions: {}

concurrency:
  group: gauntlet-results
  cancel-in-progress: false

env:
  # One basis point is 0.01 percentage points. A smoke-tier model is 2pp, so
  # any new smoke failure trips the ratchet; abc-1k tolerates at most 0.50pp.
  MAX_STAGE_DROP_BPS: "50"

jobs:
  run:
    name: Run corpus gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      results_ready: ${{ steps.trend.outputs.results_ready }}
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select manifest tier
        id: tier
        env:
          REQUESTED_TIER: ${{ inputs.tier }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "47 3 * * 0" ]; then
            tier=abc-1k
          elif [ -n "$REQUESTED_TIER" ]; then
            tier=$REQUESTED_TIER
          else
            tier=smoke
          fi
          case "$tier" in
            smoke|abc-1k) ;;
            *) echo "Unsupported gauntlet tier: $tier" >&2; exit 2 ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - name: Build gauntlet
        run: cargo build -p remus-gauntlet --profile ci-test
      - name: Fetch verified corpus
        env:
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          target/ci-test/remus-gauntlet fetch \
            "tools/gauntlet/manifests/${TIER}.json" \
            --cache "$RUNNER_TEMP/gauntlet-cache" \
            --output-list "$RUNNER_TEMP/models.txt"
      - name: Run bounded isolated models
        run: |
          mapfile -t models < "$RUNNER_TEMP/models.txt"
          test "${#models[@]}" -gt 0
          target/ci-test/remus-gauntlet run \
            --output "$RUNNER_TEMP/gauntlet-results" \
            --timeout-ms 30000 \
            --jobs 2 \
            -- "${models[@]}"
          cat "$RUNNER_TEMP/gauntlet-results/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Load prior trend
        env:
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          history="$RUNNER_TEMP/trend.jsonl"
          : > "$history"
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin refs/heads/results
            path="trends/${TIER}.jsonl"
            if git cat-file -e "FETCH_HEAD:${path}" 2>/dev/null; then
              git show "FETCH_HEAD:${path}" > "$history"
            fi
          fi
      - name: Generate trend row and enforce ratchet
        id: trend
        env:
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          manifest="tools/gauntlet/manifests/${TIER}.json"
          manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
          echo "results_ready=true" >> "$GITHUB_OUTPUT"
          target/ci-test/remus-gauntlet trend \
            --scoreboard "$RUNNER_TEMP/gauntlet-results/scoreboard.json" \
            --history "$RUNNER_TEMP/trend.jsonl" \
            --output-row "$RUNNER_TEMP/gauntlet-results/trend-row.json" \
            --tier "$TIER" \
            --date "$(date -u +%F)" \
            --sha "$GITHUB_SHA" \
            --manifest-sha256 "$manifest_sha" \
            --max-drop-bps "$MAX_STAGE_DROP_BPS"
      - name: Upload aggregate scoreboard
        if: ${{ always() && steps.trend.outputs.results_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gauntlet-${{ steps.tier.outputs.tier }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gauntlet-results/scoreboard.json
            ${{ runner.temp }}/gauntlet-results/scoreboard.md
            ${{ runner.temp }}/gauntlet-results/trend-row.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish aggregate trend
    needs: run
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.run.outputs.results_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gauntlet-${{ needs.run.outputs.tier }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gauntlet-artifact
      - name: Append aggregate result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact="$RUNNER_TEMP/gauntlet-artifact"
          row="$artifact/trend-row.json"
          test -s "$artifact/scoreboard.json"
          test -s "$artifact/scoreboard.md"
          test -s "$row"
          jq -e '.schema_version == 1 and .models > 0' "$artifact/scoreboard.json" >/dev/null
          schema=$(jq -er '.schema' "$row")
          tier=$(jq -er '.tier' "$row")
          run_date=$(jq -er '.date' "$row")
          kernel_sha=$(jq -er '.kernel_sha' "$row")
          test "$schema" = "remus-gauntlet-trend-v1"
          case "$tier" in smoke|abc-1k) ;; *) exit 2 ;; esac
          [[ "$run_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$kernel_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$kernel_sha" = "$GITHUB_SHA"

          repo="$RUNNER_TEMP/gauntlet-results-branch"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q "$repo"
          git -C "$repo" remote add origin "$remote"
          if git ls-remote --exit-code --heads "$remote" results >/dev/null 2>&1; then
            git -C "$repo" fetch -q --depth=1 origin refs/heads/results
            git -C "$repo" checkout -q -B results FETCH_HEAD
          else
            git -C "$repo" checkout -q --orphan results
            printf '%s\n' '# Remus gauntlet aggregate results' > "$repo/README.md"
          fi

          mkdir -p "$repo/trends"
          cat "$row" >> "$repo/trends/${tier}.jsonl"
          run_key="${run_date}-${kernel_sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_dir="$repo/scoreboards/${tier}/runs/${run_key}"
          latest_dir="$repo/scoreboards/${tier}/latest"
          mkdir -p "$run_dir" "$latest_dir"
          cp "$artifact/scoreboard.json" "$run_dir/scoreboard.json"
          cp "$artifact/scoreboard.md" "$run_dir/scoreboard.md"
          cp "$artifact/scoreboard.json" "$latest_dir/scoreboard.json"
          cp "$artifact/scoreboard.md" "$latest_dir/scoreboard.md"

          git -C "$repo" add README.md trends scoreboards
          git -C "$repo" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore(gauntlet): record ${tier} trend ${run_date} [skip ci]"
          git -C "$repo" push -q origin HEAD:results
