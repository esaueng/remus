name: OpSeq 8.1 Campaign

# Bounded operation-sequence campaign (P-Class 8.1 harness). Runs the
# deterministic campaign in isolated child processes with resumable
# checkpoints; findings upload as artifacts with the explicit eight-bucket
# failure taxonomy in the job log (B81TALLY/B81CASE/B81COVERAGE lines).
#
# REVIEW FLAG: this is a NEW scheduled workflow (not a change to an existing
# gate). It runs inline on ubuntu-24.04 rather than delegating to a
# fleet-* workflow, deliberately, so no trusted-workflow routing changes.
# The PR gate itself needs no workflow: `ci_regression_matrix` and
# `campaign_coverage` run inside the existing workspace test suite.
# If the weekly cadence, case budget, or runner choice is wrong, say so in
# review — deleting this file loses nothing (local runs use
# tools/opseq81-campaign.sh).

on:
  schedule:
    # Weekly, Sunday 04:30 UTC — clear of the fuzz (03:30 Sun) and gauntlet
    # weekly (03:47 Sun) slots.
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      cases:
        description: Sequence count (OPSEQ81_CASES)
        required: false
        default: "256"
      seed:
        description: Campaign seed (OPSEQ81_SEED)
        required: false
        default: "8478446"

permissions:
  contents: read

env:
  OPSEQ81_REVISION: ${{ github.sha }}
  OPSEQ81_OUT: ${{ github.workspace }}/opseq81-findings
  OPSEQ81_CHECKPOINT: ${{ github.workspace }}/opseq81-findings/checkpoint.jsonl
  OPSEQ81_ISOLATE: "1"

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.96.0"
      - name: Coverage matrix (static, no kernel)
        run: >
          cargo test --release -p remus-operations --test op_seq_81
          campaign_coverage -- --nocapture
      - name: Bounded campaign (isolated, resumable)
        run: >
          OPSEQ81_CASES="${{ inputs.cases || '256' }}"
          OPSEQ81_SEED="${{ inputs.seed || '8478446' }}"
          cargo test --release -p remus-operations --test op_seq_81
          bounded_campaign -- --nocapture
      - name: Upload findings and checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opseq81-campaign-findings
          path: opseq81-findings/
          if-no-files-found: ignore
          retention-days: 30
