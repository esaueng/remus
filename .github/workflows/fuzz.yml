name: Fuzz Smoke

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The reader targets hunt a panic on malformed input. The engine targets hunt
  # a different animal — a well-formed, confident, wrong solid — and a failure
  # there is a correctness bug, not a robustness one. They share a job shape but
  # not a purpose.
  targets:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - step_reader
          - iges_reader
          - stl_reader
          - obj_reader
          - ply_reader
          - glb_reader
          - threemf_reader
          - boolean_tree
          - modifier_ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@c93f4f9c67595668add93d3d6895795ce52d8c2d # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Run bounded smoke fuzzing
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120 -rss_limit_mb=2048
