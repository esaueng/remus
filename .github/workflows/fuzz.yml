name: Fuzz Smoke

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-cargo-fuzz:
    name: Prepare cargo-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - name: Install cargo-fuzz once
        run: |
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
          mkdir -p "$RUNNER_TEMP/cargo-fuzz"
          cp "$HOME/.cargo/bin/cargo-fuzz" "$RUNNER_TEMP/cargo-fuzz/cargo-fuzz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-fuzz
          path: ${{ runner.temp }}/cargo-fuzz/cargo-fuzz
          if-no-files-found: error
          retention-days: 1

  # The reader targets hunt a panic on malformed input. The engine targets hunt
  # a different animal — a well-formed, confident, wrong solid — and a failure
  # there is a correctness bug, not a robustness one. They share a job shape but
  # not a purpose.
  targets:
    name: ${{ matrix.target }}
    needs: [prepare-cargo-fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - step_reader
          - iges_reader
          - stl_reader
          - obj_reader
          - ply_reader
          - glb_reader
          - threemf_reader
          - threemf_xml
          - brep_reader
          - step_assembly
          - boolean_tree
          - modifier_ops
          - nurbs_surface
          - topology_mutation
          - arena_roundtrip
          - tessellation
          - curve_intersection
          - offset
          - gcs
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-fuzz
          path: ${{ runner.temp }}/cargo-fuzz
      - name: Add cargo-fuzz to PATH
        run: |
          chmod +x "$RUNNER_TEMP/cargo-fuzz/cargo-fuzz"
          echo "$RUNNER_TEMP/cargo-fuzz" >> "$GITHUB_PATH"
      - name: Run bounded smoke fuzzing
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120 -timeout=10 -rss_limit_mb=2048
      # libFuzzer writes the crashing input under fuzz/artifacts/<target>/;
      # without this upload the only trace of a finding is the panic line in
      # the log, and the input itself is lost with the runner.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
