name: Notify OpenZCAD of Remus package release

on:
  push:
    branches: [main]
    paths:
      - 'crates/wasm/pkg/package.json'
      - 'crates/wasm-io/pkg/package.json'

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.repository == 'esaueng/remus' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm paired package publication
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kernel_sha="$(gh api 'repos/esaueng/remus/commits?path=crates%2Fwasm%2Fpkg%2Fpackage.json&sha=main&per_page=1' --jq '.[0].sha')"
          io_sha="$(gh api 'repos/esaueng/remus/commits?path=crates%2Fwasm-io%2Fpkg%2Fpackage.json&sha=main&per_page=1' --jq '.[0].sha')"
          if [[ ! "$kernel_sha" =~ ^[0-9a-f]{40}$ || "$kernel_sha" != "$io_sha" ]]; then
            echo "::error title=Split Remus release::Both package manifests must come from the same main commit."
            exit 1
          fi
          event_kernel_sha="$(gh api "repos/esaueng/remus/commits?path=crates%2Fwasm%2Fpkg%2Fpackage.json&sha=$GITHUB_SHA&per_page=1" --jq '.[0].sha')"
          event_io_sha="$(gh api "repos/esaueng/remus/commits?path=crates%2Fwasm-io%2Fpkg%2Fpackage.json&sha=$GITHUB_SHA&per_page=1" --jq '.[0].sha')"
          if [[ "$event_kernel_sha" != "$kernel_sha" || "$event_io_sha" != "$io_sha" ]]; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "A newer paired package release superseded the release at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "notify=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.release.outputs.notify == 'true'
        with:
          app-id: ${{ vars.REMUS_BOT_APP_ID }}
          private-key: ${{ secrets.REMUS_BOT_PRIVATE_KEY }}
          owner: esaueng
          repositories: OpenZCAD
          permission-contents: write

      - name: Start OpenZCAD updater
        if: steps.release.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method POST repos/esaueng/OpenZCAD/dispatches \
            -f event_type=remus_packages_published
          echo "OpenZCAD updater dispatched for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
