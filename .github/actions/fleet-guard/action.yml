name: Verify trusted runner
description: Verify event identity and disposable runner isolation before checkout
runs:
  using: composite
  steps:
    - name: Check identity and immutable merge parents
      if: runner.environment == 'self-hosted' && github.event_name == 'pull_request'
      env:
        ENABLED: "true"
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_ID: ${{ github.repository_id }}
        ACTOR: ${{ github.actor }}
        ACTOR_ID: ${{ github.actor_id }}
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        REF: ${{ github.ref }}
        SHA: ${{ github.sha }}
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        import urllib.request

        OWNER = "petergstfsn"
        OWNER_ID = 171875562
        REPOSITORY = "esaueng/remus"
        REPOSITORY_ID = 1334765869

        def valid_pr(pr):
            def same_repo(repo):
                return (repo.get("id") == REPOSITORY_ID
                        and repo.get("full_name") == REPOSITORY
                        and repo.get("fork") is False)

            head = pr.get("head") or {}
            base = pr.get("base") or {}
            author = pr.get("user") or {}
            return (
                pr.get("state") == "open"
                and type(pr.get("number")) is int and pr["number"] > 0
                and author.get("login") == OWNER and author.get("id") == OWNER_ID
                and same_repo(head.get("repo") or {})
                and same_repo(base.get("repo") or {})
                and base.get("ref") == "main"
                and all(re.fullmatch(r"[0-9a-f]{40}", str(side.get("sha", "")))
                        for side in (head, base))
            )

        def eligible(event, context):
            pr = event.get("pull_request") or {}
            sender = event.get("sender") or {}
            return (
                context.get("ENABLED") == "true"
                and context.get("EVENT_NAME") == "pull_request"
                and context.get("REPOSITORY") == REPOSITORY
                and context.get("REPOSITORY_ID") == str(REPOSITORY_ID)
                and context.get("ACTOR") == OWNER
                and context.get("ACTOR_ID") == str(OWNER_ID)
                and context.get("TRIGGERING_ACTOR") == OWNER
                and sender.get("login") == OWNER and sender.get("id") == OWNER_ID
                and valid_pr(pr)
                and context.get("REF") == f"refs/pull/{pr['number']}/merge"
                and re.fullmatch(r"[0-9a-f]{40}", context.get("SHA", "")) is not None
            )

        def current_merge(event_pr, current_pr, commit, sha):
            return (
                valid_pr(current_pr)
                and current_pr["number"] == event_pr["number"]
                and all(current_pr[side]["sha"] == event_pr[side]["sha"]
                        for side in ("head", "base"))
                and commit.get("sha") == sha
                and [parent.get("sha") for parent in commit.get("parents", [])]
                    == [event_pr["base"]["sha"], event_pr["head"]["sha"]]
            )

        def get(path):
            request = urllib.request.Request(
                f"https://api.github.com/repos/{REPOSITORY}/{path}",
                headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                         "Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28"},
            )
            with urllib.request.urlopen(request, timeout=30) as response:
                return json.load(response)

        def main():
            with open(os.environ["GITHUB_EVENT_PATH"]) as stream:
                event = json.load(stream)
            trusted = False
            if eligible(event, os.environ):
                pr = event["pull_request"]
                sha = os.environ["SHA"]
                trusted = current_merge(pr, get(f"pulls/{pr['number']}"),
                                        get(f"commits/{sha}"), sha)
            if not trusted:
                raise SystemExit("PR identity or merge parents no longer match")
            with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                output.write(f"trusted={str(trusted).lower()}\n")
            print("Owner PR authorized for trusted fleet" if trusted else "Use hosted CI")

        if __name__ == "__main__":
            main()
        PY
    - name: Verify runner isolation and fresh storage
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_NAME" in
          ci-vm-1441561|ci-server-jane|ci-server-john)
            CI_USER=ci-runner CI_STORAGE=/srv/ci CI_SLICE=ci.slice
            CI_DOCKER=ci-docker CI_MEMORY=3221225472 CI_CPUS=1
            CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 ;;
          ci-server-jane-1|ci-server-jane-2)
            slot=${RUNNER_NAME##*-}
            CI_USER=ci-slot$slot CI_STORAGE=/srv/ci-slot$slot CI_SLICE=cislot$slot.slice
            CI_DOCKER=ci-slot$slot-docker CI_MEMORY=6442450944 CI_CPUS=6
            CARGO_BUILD_JOBS=3 RUST_TEST_THREADS=6 ;;
          *) echo 'Unknown trusted runner' >&2; exit 1 ;;
        esac
        CI_CGROUP=/sys/fs/cgroup/$CI_SLICE
        test "$(id -un)" = "$CI_USER"
        test "$(id -u)" != 0
        test "$HOME" = "$CI_STORAGE/home"
        test -f "/opt/$CI_USER/bin/Runner.Listener"
        test -f "/etc/systemd/system/$CI_USER.service"
        test ! -w "/opt/$CI_USER/bin/Runner.Listener"
        test ! -w "/etc/systemd/system/$CI_USER.service"
        test "$(awk '/^NoNewPrivs:/ {print $2}' /proc/self/status)" = 1
        test ! -e "$HOME/.app-ci-sentinel"
        test ! -e "$CI_STORAGE/work/.app-ci-sentinel"
        touch "$HOME/.app-ci-sentinel" "$CI_STORAGE/work/.app-ci-sentinel"
        test "$DOCKER_HOST" = "unix:///run/$CI_DOCKER/docker.sock"
        docker info --format '{{json .SecurityOptions}}' | jq -e 'index("name=rootless") != null'
        test -z "$(docker ps --all --quiet)"
        test -z "$(docker image ls --quiet)"
        test "$(cat "$CI_CGROUP/memory.max")" = "$CI_MEMORY"
        test "$(cat "$CI_CGROUP/memory.swap.max")" = 0
        awk -v cpus="$CI_CPUS" '{exit !($1 == $2 * cpus)}' "$CI_CGROUP/cpu.max"
        grep -Fx "0::/$CI_SLICE/$CI_USER.service" /proc/self/cgroup
        case ",$(findmnt -n -o OPTIONS --mountpoint "$CI_STORAGE")," in
          *,nosuid,*) ;; *) exit 1 ;; esac
        {
          echo "CI_CGROUP=$CI_CGROUP"
          echo "CI_STORAGE=$CI_STORAGE"
          echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS"
          echo "RUST_TEST_THREADS=$RUST_TEST_THREADS"
        } >> "$GITHUB_ENV"
