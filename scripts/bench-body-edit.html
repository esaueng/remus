<!doctype html>
<meta charset="utf-8">
<title>Remus body edit benchmark</title>
<p>Exact body edits in a browser worker; no OpenZCAD rebuild or paint timing.</p>
<button id="run">Run benchmark</button>
<pre id="result">Ready</pre>
<script type="module">
document.querySelector('#run').onclick = () => {
  document.querySelector('#result').textContent = 'Running';
  const worker = new Worker('./bench-body-edit-worker.mjs', { type: 'module' });
  worker.onmessage = ({data}) => {
    document.querySelector('#result').textContent = JSON.stringify(data, null, 2);
    worker.terminate();
  };
  worker.onerror = error => {document.querySelector('#result').textContent = error.message; worker.terminate();};
};
</script>
