# OSV sees every package recorded for every target in Cargo.lock, including
# build-time and optional desktop-viewer dependencies. Keep these exceptions
# aligned with deny.toml and expire them so the upstream chains are revisited.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2027-01-07
reason = "ttf-parser 0.25.1 is unmaintained (informational; no patched release). It enters only via owned_ttf_parser -> ab_glyph -> sctk-adwaita -> winit, behind remus-render's optional desktop `window` feature, to draw Wayland window-title decorations from system fonts; no kernel, wasm or io path depends on it. cargo-deny does not flag it because unmaintained checks are scoped to workspace (direct) dependencies"
