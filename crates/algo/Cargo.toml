[package]
description = "GFA boolean algorithm engine for remus"
edition.workspace = true
license.workspace = true
name = "remus-algo"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
remus-math.workspace = true
remus-topology.workspace = true

log.workspace = true
thiserror.workspace = true

[features]
# Enables deterministic work counters (`perf` module) used by the
# complexity-regression scaling guards. Off by default — zero cost in normal
# and release builds (the bump calls compile to nothing).
perf-counters = []

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
remus-check.workspace = true
remus-topology = {workspace = true, features = ["test-utils"]}

[[bench]]
harness = false
name = "gfa_inner_loops"

[lints]
workspace = true
