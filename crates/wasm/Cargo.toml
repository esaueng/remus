[package]
categories = ["wasm", "mathematics", "science"]
description = "WebAssembly bindings for remus — browser-native B-Rep solid modeling"
edition.workspace = true
keywords = ["cad", "brep", "wasm", "geometry", "solid-modeling"]
license.workspace = true
name = "remus-wasm"
repository.workspace = true
rust-version.workspace = true
version = "2.130.0"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-simd"]

[features]
default = ["io"]
# Diagnostic-only build; never enabled in the shipped package.
workflow-probes = []
# Bundle the file-format translators into the kernel module. The shipped
# browser package builds WITHOUT this (see `cargo xtask wasm-build`): the
# translators ship as the separate `remus-wasm-io` module and bodies cross
# between the two as exact arena documents. The arena and persistent-reference
# codecs are always present.
io = ["remus-io/formats"]

[dependencies]
log.workspace = true
remus-algo.workspace = true
remus-check.workspace = true
remus-geometry.workspace = true
remus-heal.workspace = true
# Explicit path: an inherited dependency cannot switch default features off.
remus-io = {path = "../io", version = "=0.1.0", default-features = false}
remus-math.workspace = true
remus-operations.workspace = true
remus-sketch.workspace = true
remus-topology.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true

[[example]]
name = "w9-native"
required-features = ["workflow-probes"]

[dev-dependencies]
remus = {path = "../remus"}

[lints]
workspace = true
