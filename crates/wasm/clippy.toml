# Per-crate Clippy config. Clippy reads the nearest clippy.toml and does not
# merge it with the workspace one, so the first two settings mirror the root
# clippy.toml; keep them in sync with it.
avoid-breaking-exported-api = false
cognitive-complexity-threshold = 25

# The bindings link into the shipped browser kernel, so they follow the kernel
# crates' sort rule (see `crates/operations/clippy.toml`): each std sort call
# site, or element type for `sort` / `sort_unstable`, compiles its own copy of
# the sort. Use `remus_math::compact_sort::CompactSort` unless measured hot.
disallowed-methods = [
  {path = "slice::sort", reason = "compiles a stable sort per element type; use remus_math::compact_sort::CompactSort::compact_sort_by(Ord::cmp), or compact_sort_unstable where equal elements are identical, unless measured hot"},
  {path = "slice::sort_by", reason = "compiles a stable sort per call site; use remus_math::compact_sort::CompactSort::compact_sort_by unless measured hot"},
  {path = "slice::sort_by_key", reason = "compiles a stable sort per call site; use remus_math::compact_sort::CompactSort::compact_sort_by_key unless measured hot"},
  {path = "slice::sort_unstable", reason = "compiles an unstable sort per element type; use remus_math::compact_sort::CompactSort::compact_sort_unstable unless measured hot"},
  {path = "slice::sort_unstable_by", reason = "compiles an unstable sort per call site; use remus_math::compact_sort::CompactSort::compact_sort_unstable_by unless measured hot or its tie order matters"},
  {path = "slice::sort_unstable_by_key", reason = "compiles an unstable sort per call site; use remus_math::compact_sort::CompactSort::compact_sort_unstable_by_key unless measured hot or its tie order matters"},
]
