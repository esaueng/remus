[package]
description = "Solid offset engine for remus"
edition.workspace = true
license.workspace = true
name = "remus-offset"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
remus-geometry.workspace = true
remus-math.workspace = true
remus-topology.workspace = true

log.workspace = true
thiserror.workspace = true

[dev-dependencies]
remus-check.workspace = true
# Path-only on purpose: remus-operations depends on remus-offset. Cargo strips
# versionless dev-dependencies from published manifests, avoiding an initial
# same-version registry cycle while preserving the in-workspace integration
# tests.
remus-operations = {path = "../operations"}
remus-topology = {workspace = true, features = ["test-utils"]}

[lints]
workspace = true
