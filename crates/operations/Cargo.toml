[package]
description = "CAD modeling operations (booleans, fillets, extrusions) for remus"
edition.workspace = true
license.workspace = true
name = "remus-operations"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
# Pass-through to remus-algo's deterministic work counters, enabled by the
# complexity-regression scaling guard (`boolean::tests::scaling_*`).
perf-counters = ["remus-algo/perf-counters"]

[dependencies]
remus-algo.workspace = true
remus-blend.workspace = true
remus-check.workspace = true
remus-geometry.workspace = true
remus-heal.workspace = true
remus-math.workspace = true
remus-offset.workspace = true
remus-sketch.workspace = true
remus-topology.workspace = true
log.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path-only (no version) on purpose: remus-io depends on remus-operations,
# so a versioned dev-requirement would create a same-version publish cycle and
# cargo strips versionless dev-dependencies from the published manifest. The
# STEP round-trip probes in tests/ resolve identically in-workspace either way.
remus-io = {path = "../io"}
remus-topology = {workspace = true, features = ["test-utils"]}
criterion.workspace = true
env_logger.workspace = true
proptest.workspace = true

[[bench]]
harness = false
name = "cad_operations"

[[bench]]
harness = false
name = "boolean_perf"

[[bench]]
harness = false
name = "compound_cut_perf"

[[bench]]
harness = false
name = "fuse_perf"

[[bench]]
harness = false
name = "boolean_tracking"

[lints]
workspace = true
