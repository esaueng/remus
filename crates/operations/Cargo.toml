[package]
description = "CAD modeling operations (booleans, fillets, extrusions) for brepkit"
edition.workspace = true
license.workspace = true
name = "brepkit-operations"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
# Pass-through to brepkit-algo's deterministic work counters, enabled by the
# complexity-regression scaling guard (`boolean::tests::scaling_*`).
perf-counters = ["brepkit-algo/perf-counters"]

[dependencies]
brepkit-algo.workspace = true
brepkit-blend.workspace = true
brepkit-check.workspace = true
brepkit-geometry.workspace = true
brepkit-heal.workspace = true
brepkit-math.workspace = true
brepkit-offset.workspace = true
brepkit-sketch.workspace = true
brepkit-topology.workspace = true
log.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Path-only (no version) on purpose: brepkit-io depends on brepkit-operations,
# so a versioned dev-requirement would create a same-version publish cycle and
# cargo strips versionless dev-dependencies from the published manifest. The
# STEP round-trip probes in tests/ resolve identically in-workspace either way.
brepkit-io = {path = "../io"}
brepkit-topology = {workspace = true, features = ["test-utils"]}
criterion.workspace = true
env_logger.workspace = true
proptest.workspace = true

[[bench]]
harness = false
name = "cad_operations"

[[bench]]
harness = false
name = "boolean_perf"

[[bench]]
harness = false
name = "compound_cut_perf"

[[bench]]
harness = false
name = "fuse_perf"

[[bench]]
harness = false
name = "boolean_tracking"

[lints]
workspace = true
