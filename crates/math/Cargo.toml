[package]
description = "Vector math, transforms, NURBS, and geometric predicates for remus"
edition.workspace = true
license.workspace = true
name = "remus-math"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
log.workspace = true
robust.workspace = true
serde = {workspace = true, optional = true}
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
harness = false
name = "nurbs_inner_loops"

[[bench]]
harness = false
name = "intersection_inner_loops"

[[bench]]
harness = false
name = "cdt_insertion"

[features]
default = []
serde = ["dep:serde"]
# Manual 4-lane blocking of the homogeneous contraction in
# `NurbsSurface::derivatives_into_with_spans` (see `contract_aw_cells_4lane`
# in `src/nurbs/surface.rs`). Same operations in the same per-lane order as
# the scalar nest, so output is bit-identical; verified by
# `contract_4lane_bit_identical` plus the hammer-holder exact-output record
# in `docs/kernel-maturity/o33-simd-evidence.md`.
simd = []

[lints]
workspace = true
