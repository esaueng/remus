[package]
description = "Multi-format B-Rep data exchange for remus (STEP, IGES, STL, 3MF, OBJ, PLY, glTF)"
edition.workspace = true
license.workspace = true
name = "remus-io"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
default = ["formats"]
# STEP, IGES, STL, 3MF, OBJ, PLY, and glTF. Off, the crate is only the exact
# arena document codec and the persistent-reference codec, which is what the
# browser kernel module links; the format translators ship as their own
# WASM module (`crates/wasm-io`).
formats = ["dep:quick-xml", "dep:zip"]

[dependencies]
quick-xml = {workspace = true, optional = true}
remus-math = {workspace = true, features = ["serde"]}
remus-operations.workspace = true
remus-topology.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip = {workspace = true, optional = true}

[dev-dependencies]
log.workspace = true
proptest.workspace = true
remus-algo.workspace = true
remus-check.workspace = true
remus-topology = {workspace = true, features = ["test-utils"]}

[lints]
workspace = true
